<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BIET - DS Group Pattern Tracker</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 95%; max-width: 1100px; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { padding: 20px; border-radius: 12px; border: 2px solid #e0e0e0; transition: 0.3s; position: relative; }
        
        /* Zone-Based Hit Highlighting */
        .zone-hit { border-color: #27ae60; background: #f0fff4; transform: translateY(-5px); box-shadow: 0 8px 20px rgba(39,174,96,0.15); }
        .hit-indicator { position: absolute; top: 10px; right: 10px; background: #27ae60; color: white; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; visibility: hidden; }
        .zone-hit .hit-indicator { visibility: visible; }

        .meter-container { background: #eee; height: 10px; border-radius: 5px; margin: 12px 0; }
        .meter-fill { background: #27ae60; height: 100%; border-radius: 5px; transition: width 0.6s; }
        .ds-badge { background: #2c3e50; color: white; padding: 4px 10px; border-radius: 5px; margin-right: 5px; font-size: 0.9em; font-weight: bold; border: 2px solid transparent; }
        .active-ds { border-color: #f1c40f; background: #34495e; } /* Highlights the specific DS that hit */
        
        .history-bar { background: #2c3e50; color: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; width: 100%; font-family: monospace; font-size: 1.2em; text-align: center;}
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input { padding: 12px; border-radius: 6px; border: 1px solid #ccc; width: 90px; font-size: 18px; text-align: center; }
        button { padding: 12px 25px; background: #27ae60; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .trend-label { color: #7f8c8d; font-size: 0.85em; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="color: #2c3e50;">📊 DS Group Pattern Source</h2>
    
    <div class="input-group">
        <input type="number" id="spinInput" placeholder="Spin" min="0" max="36">
        <button onclick="handleSpin()">Submit Result</button>
    </div>

    <div class="history-bar" id="history">Waiting for spins...</div>

    <div class="grid" id="predictionGrid"></div>
</div>

<script>
    let spins = [];
    let lastPredictionsDS = {}; // Stores the Double Streets (1-6) predicted previously
    let stats = {
        "Only (-)": { hits: 0, total: 0 }, "Only (- & -1)": { hits: 0, total: 0 },
        "Only (- & +1)": { hits: 0, total: 0 }, "Only (+)": { hits: 0, total: 0 },
        "Only (+ & -1)": { hits: 0, total: 0 }, "Only (+ & +1)": { hits: 0, total: 0 }
    };

    const terminalMap = {
        1:[8], 2:[7,9], 3:[8], 4:[11], 5:[10,12], 6:[11], 7:[2,9], 8:[1,3,13,15], 9:[2,14], 10:[5,17],
        11:[4,6,16,18], 12:[5,17], 13:[8,20], 14:[7,9,19,21], 15:[8,20], 16:[11,23], 17:[10,12,22,24],
        18:[11,23], 19:[14,26], 20:[13,15,25,27], 21:[14,26], 22:[17,29], 23:[16,18,28,30], 24:[17,29],
        25:[20,32], 26:[19,21,31,33], 27:[20,32], 28:[23,35], 29:[22,24,34,36], 30:[23,35], 31:[26],
        32:[25,27], 33:[26], 34:[29], 35:[28,30], 36:[29]
    };

    function getDS(num) { return num === 0 ? 0 : Math.ceil(num / 6); }

    function handleSpin() {
        const val = parseInt(document.getElementById('spinInput').value);
        if (isNaN(val) || val < 0 || val > 36) return;
        
        const currentDS = getDS(val);
        let winningOps = [];

        // Check against DS Groups instead of exact numbers
        if (Object.keys(lastPredictionsDS).length > 0) {
            for (let opName in lastPredictionsDS) {
                stats[opName].total++;
                if (lastPredictionsDS[opName].includes(currentDS)) {
                    stats[opName].hits++;
                    winningOps.push(opName);
                }
            }
        }

        spins.push(val);
        document.getElementById('spinInput').value = '';
        updateUI(currentDS, winningOps);
    }

    function updateUI(currentDS, winningOps) {
        document.getElementById('history').innerText = spins.join(" → ");
        const grid = document.getElementById('predictionGrid');
        grid.innerHTML = '';

        if (spins.length < 2) return;

        const last = spins[spins.length - 1];
        const prev = spins[spins.length - 2];

        const ops = [
            { name: "Only (-)", res: Math.abs(last - prev) },
            { name: "Only (- & -1)", res: Math.abs(last - prev) - 1 },
            { name: "Only (- & +1)", res: Math.abs(last - prev) + 1 },
            { name: "Only (+)", res: (last + prev) },
            { { name: "Only (+ & -1)", res: (last + prev) - 1 },
            { { name: "Only (+ & +1)", res: (last + prev) + 1 }
        ];

        let nextPredictionsDS = {};

        ops.forEach(op => {
            const deltaNum = op.res;
            const terminals = terminalMap[deltaNum] || [];
            // Group targets = Delta DS + Terminal DS
            const targetDS = [...new Set([deltaNum, ...terminals].map(n => getDS(n)))].filter(d => d > 0 && d <= 6);
            nextPredictionsDS[op.name] = targetDS;

            const hitRate = stats[op.name].total === 0 ? 0 : Math.round((stats[op.name].hits / stats[op.name].total) * 100);
            const isWinner = winningOps.includes(op.name);

            const card = document.createElement('div');
            card.className = `card ${isWinner ? 'zone-hit' : ''}`;
            
            card.innerHTML = `
                <div class="hit-indicator">ZONE HIT</div>
                <strong>${op.name}</strong>
                <div class="trend-label">Pattern Accuracy: ${hitRate}%</div>
                <div class="meter-container"><div class="meter-fill" style="width: ${hitRate}%"></div></div>
                <div style="margin-top:15px;">
                    ${targetDS.map(ds => `
                        <span class="ds-badge ${isWinner && ds === currentDS ? 'active-ds' : ''}">
                            DS ${ds}
                        </span>`).join('')}
                </div>
                <p style="font-size:0.8em; color:#95a5a6; margin-top:10px;">
                    Targeting: ${targetDS.map(d => `${(d*6)-5}-${d*6}`).join(', ')}
                </p>
            `;
            grid.appendChild(card);
        });

        lastPredictionsDS = nextPredictionsDS;
    }
</script>
</body>
</html>

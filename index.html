<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Attendance System</title>
    <style>
        :root {
            --primary: #2563eb;
            --success: #16a34a;
            --danger: #dc2626;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h2 {
            margin-top: 0;
            color: #0f172a;
        }

        .clock {
            font-size: 2.5rem;
            font-weight: bold;
            margin: 20px 0;
            color: var(--primary);
            font-variant-numeric: tabular-nums;
        }

        .date {
            color: #64748b;
            margin-bottom: 30px;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: border 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            color: white;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-checkin { background-color: var(--success); }
        .btn-checkout { background-color: var(--danger); }

        /* Access Denied Overlay */
        #access-denied {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--danger);
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        #access-denied h1 { font-size: 3rem; margin-bottom: 10px; }
        #access-denied p { color: #64748b; font-size: 1.2rem; }

        /* Status Message */
        #status-log {
            margin-top: 20px;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            display: none;
        }
        .success-log { background: #dcfce7; color: #15803d; }
    </style>
</head>
<body>

    <div id="access-denied">
        <h1>⚠️ Access Denied</h1>
        <p>This system can only be accessed from the authorized company domain.</p>
    </div>

    <div class="container" id="app-container">
        <div class="card">
            <h2>Workplace Attendance</h2>
            <div class="clock" id="live-clock">00:00:00 AM</div>
            <div class="date" id="live-date">Loading date...</div>

            <div class="form-group">
                <label for="employee-id">Employee ID</label>
                <input type="text" id="employee-id" placeholder="e.g. EMP-1024" required>
            </div>

            <div class="btn-group">
                <button class="btn-checkin" onclick="logAttendance('Check-In')">Clock In</button>
                <button class="btn-checkout" onclick="logAttendance('Check-Out')">Clock Out</button>
            </div>

            <div id="status-log"></div>
        </div>
    </div>

    <script>
        // CONFIGURATION: Set your specific allowed domain here
        const ALLOWED_DOMAIN = "yourcompany.com"; 

        // 1. Security Check: Verify Host/Domain
        function verifyDomain() {
            const currentHost = window.location.hostname;
            
            // Allow localhost for testing/development, otherwise enforce rule
            if (currentHost !== ALLOWED_DOMAIN && currentHost !== "localhost" && currentHost !== "127.0.0.1") {
                document.getElementById('app-container').style.display = 'none';
                document.getElementById('access-denied').style.display = 'flex';
                return false;
            }
            return true;
        }

        // 2. Real-time Clock and Date
        function updateClock() {
            const now = new Date();
            
            // Time
            document.getElementById('live-clock').textContent = now.toLocaleTimeString([], {
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit'
            });
            
            // Date
            document.getElementById('live-date').textContent = now.toLocaleDateString([], {
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric'
            });
        }

        // 3. Attendance Logic
        function logAttendance(type) {
            const empId = document.getElementById('employee-id').value.trim();
            
            if (!empId) {
                alert("Please enter your Employee ID before logging time.");
                return;
            }

            const currentTime = new Date().toLocaleTimeString();
            const logDiv = document.getElementById('status-log');
            
            // Display visual success confirmation
            logDiv.className = "success-log";
            logDiv.style.display = "block";
            logDiv.innerHTML = `<strong>Success!</strong> ${empId} signed <b>${type}</b> at ${currentTime}.`;

            // Ready for Backend integration:
            console.log(`Sending Payload: Data={ Employee: ${empId}, Action: ${type}, Time: ${new Date().toISOString()} }`);
            
            // Optional: Clear input field after successful log
            document.getElementById('employee-id').value = "";
        }

        // Initialize setup on page load
        if (verifyDomain()) {
            setInterval(updateClock, 1000);
            updateClock();
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Marks Distributor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 40px; background-color: #f0f2f5; line-height: 1.6; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { color: #1a73e8; border-bottom: 2px solid #e8f0fe; padding-bottom: 10px; }
        .upload-section { border: 2px dashed #4285f4; padding: 30px; text-align: center; border-radius: 8px; background: #f8fbff; margin: 20px 0; }
        .instructions { font-size: 0.9em; color: #5f6368; background: #fff3cd; padding: 10px; border-radius: 5px; border-left: 5px solid #ffca28; }
        .btn-group { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
        button { padding: 12px 24px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: 0.3s; }
        .btn-process { background: #1a73e8; color: white; }
        .btn-process:hover { background: #1557b0; }
        .btn-download { background: #34a853; color: white; display: none; }
        #status { margin-top: 15px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>Academic Marks Distribution System</h2>
    
    <div class="instructions">
        <strong>Upload Format:</strong> Your Excel/CSV must have two columns in the first sheet: <br>
        1. <b>Roll No</b> | 2. <b>Total Marks</b> (Max 35)
    </div>

    <div class="upload-section">
        <input type="file" id="fileInput" accept=".xlsx, .xls, .csv" />
        <p>Click to upload or drag and drop your student list</p>
    </div>

    <div class="btn-group">
        <button class="btn-process" onclick="processFile()">Generate Distribution</button>
        <button id="downloadBtn" class="btn-download" onclick="downloadExcel()">Download Formatted Excel</button>
    </div>

    <div id="status"></div>
</div>

<script>
    let processedData = [];

    function processFile() {
        const fileInput = document.getElementById('fileInput');
        const status = document.getElementById('status');
        
        if (!fileInput.files[0]) {
            alert("Please select a file first!");
            return;
        }

        const reader = new FileReader();
        reader.onload = (e) => {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const sheetName = workbook.SheetNames[0];
            const json = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName]);

            if (json.length === 0) {
                status.innerHTML = "❌ Error: The file is empty.";
                return;
            }

            processedData = json.map(row => {
                // Find keys regardless of case
                const roll = row["Roll No"] || row["roll no"] || row["Roll"] || Object.values(row)[0];
                const total = parseFloat(row["Total Marks"] || row["total"] || Object.values(row)[1]);

                return calculateDistribution(roll, total);
            });

            status.innerHTML = `✅ Successfully processed ${processedData.length} students!`;
            document.getElementById('downloadBtn').style.display = 'inline-block';
        };
        reader.readAsArrayBuffer(fileInput.files[0]);
    }

    function calculateDistribution(roll, total) {
        let remaining = total;
        
        // 1. Objective (Max 10)
        let obj = Math.min(remaining, 10);
        remaining -= obj;

        // 2. Assignment (Max 5) - Logic: Randomly pick CO1 or CO2
        let assCO1 = 0;
        let assCO2 = 0;
        let assVal = Math.min(remaining, 5);
        if (Math.random() > 0.5) {
            assCO1 = assVal;
        } else {
            assCO2 = assVal;
        }
        remaining -= assVal;

        // 3. Descriptive (Only 4 questions can have marks out of 6)
        let qs = [0, 0, 0, 0, 0, 0];
        let indices = [0, 1, 2, 3, 4, 5].sort(() => 0.5 - Math.random()).slice(0, 4);

        for (let idx of indices) {
            if (remaining <= 0) break;
            let score = Math.min(remaining, 5);
            qs[idx] = score;
            remaining -= score;
        }

        return {
            "Roll No": roll,
            "Q1(5) CO1": qs[0],
            "Q2(5) CO1": qs[1],
            "Q3(5) CO1": qs[2],
            "Q4(5) CO2": qs[3],
            "Q5(5) CO2": qs[4],
            "Q6(5) CO2": qs[5],
            "Objective(10)": obj,
            "Assign-CO1": assCO1,
            "Assign-CO2": assCO2,
            "Total Obtained": total
        };
    }

    function downloadExcel() {
        const worksheet = XLSX.utils.json_to_sheet(processedData);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Marks Distribution");
        
        // Generate file and trigger download
        XLSX.writeFile(workbook, "Marks_Distribution_Output.xlsx");
    }
</script>

</body>
</html>

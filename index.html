<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roulette Section Tracker</title>
    <style>
        :root {
            --green: #2e7d32;
            --red: #c62828;
            --black: #212121;
            --gold: #fbc02d;
            --blue: #1976d2;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a1a; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        
        /* Table Styling */
        .roulette-table { display: grid; grid-template-columns: repeat(14, 1fr); gap: 2px; background: #444; padding: 10px; border-radius: 8px; margin-bottom: 20px; }
        .cell { width: 45px; height: 60px; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; border-radius: 4px; transition: transform 0.1s; border: 1px solid rgba(255,255,255,0.1); }
        .cell:hover { transform: scale(1.05); filter: brightness(1.2); }
        .cell.red { background: var(--red); }
        .cell.black { background: var(--black); }
        .cell.green { background: var(--green); grid-row: span 3; height: auto; }
        .cell.betting { border: 3px solid var(--gold); box-shadow: 0 0 10px var(--gold); }

        /* Dashboard Styling */
        .dashboard { width: 90%; max-width: 1000px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .panel { background: #2d2d2d; padding: 15px; border-radius: 8px; border-top: 4px solid var(--blue); }
        .stat-table { width: 100%; border-collapse: collapse; font-size: 0.9em; }
        .stat-table th, .stat-table td { padding: 8px; border-bottom: 1px solid #444; text-align: left; }
        
        .win-banner { color: #4caf50; font-weight: bold; font-size: 1.2em; margin-top: 10px; }
        .loss-banner { color: #f44336; font-weight: bold; font-size: 1.2em; margin-top: 10px; }
        .bet-badge { background: var(--gold); color: black; padding: 2px 6px; border-radius: 4px; margin-right: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Roulette Section Tracker</h1>

    <div class="roulette-table" id="table">
        <div class="cell green" onclick="inputSpin(0)">0</div>
        </div>

    <div class="dashboard">
        <div class="panel">
            <h3>Section Analysis</h3>
            <table class="stat-table" id="sectionData">
                <thead>
                    <tr>
                        <th>Section</th>
                        <th>Coldest</th>
                        <th>Hottest</th>
                    </tr>
                </thead>
                <tbody>
                    </tbody>
            </table>
        </div>

        <div class="panel">
            <h3>Betting Strategy</h3>
            <div id="statusMessage">Enter results by clicking the table.</div>
            <div id="currentBetsDisplay" style="margin-top: 15px;">
                <strong>Active Bets:</strong> <span id="betsList">None</span>
            </div>
            <div id="winLossAnalysis" style="margin-top: 15px; border-top: 1px solid #555; padding-top: 10px;">
                </div>
        </div>
    </div>

<script>
    // Configuration from Java
    const SECTIONS = {
        TIER: [27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33],
        ORPHILINE: [17, 34, 6, 1, 20, 14, 31, 9],
        VOISION: [22, 18, 29, 7, 28, 19, 4, 21, 2, 25],
        ZERO: [15, 32, 0, 26, 3, 35, 12]
    };
    const SEC_NAMES = ["TIER", "ORPHILINE", "VOISION", "ZERO"];
    const RED_NUMS = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];

    // State
    let spinHistory = [];
    let occurrenceMap = {};
    let currentBets = [];
    let currentSectionIdx = 0;
    let usedIndexBySection = {0: new Set(), 1: new Set(), 2: new Set(), 3: new Set()};
    let totalWins = 0;
    let last5Wins = [];

    // Initialize Table View
    function initTable() {
        const table = document.getElementById('table');
        for (let i = 1; i <= 36; i++) {
            const cell = document.createElement('div');
            cell.className = `cell ${RED_NUMS.includes(i) ? 'red' : 'black'}`;
            cell.id = `cell-${i}`;
            cell.innerText = i;
            cell.onclick = () => inputSpin(i);
            table.appendChild(cell);
        }
    }

    function inputSpin(num) {
        spinHistory.push(num);
        occurrenceMap[num] = (occurrenceMap[num] || 0) + 1;
        
        checkWin(num);
        updateUI();
    }

    function checkWin(num) {
        const status = document.getElementById('statusMessage');
        if (currentBets.includes(num)) {
            totalWins++;
            last5Wins.push(num);
            if(last5Wins.length > 5) last5Wins.shift();
            
            status.innerHTML = `<div class="win-banner">WIN! Result: ${num} (Total: ${totalWins})</div>`;
            resetStrategy();
        } else if (currentBets.length > 0) {
            status.innerHTML = `<div class="loss-banner">Loss: ${num}. Adding next section...</div>`;
            progressStrategy();
        } else {
            // First time or starting over
            progressStrategy();
        }
    }

    function resetStrategy() {
        currentBets = [];
        SEC_NAMES.forEach((_, i) => usedIndexBySection[i].clear());
        currentSectionIdx = (currentSectionIdx + 1) % 4;
        progressStrategy();
    }

    function progressStrategy() {
        // Logic from getNextColdNumberFromCurrentSection
        let found = false;
        let attempts = 0;

        while(!found && attempts < 4) {
            const secName = SEC_NAMES[currentSectionIdx];
            const sectionNums = SECTIONS[secName];
            
            // Sort by occurrences
            let sorted = [...sectionNums].sort((a, b) => (occurrenceMap[a] || 0) - (occurrenceMap[b] || 0));
            
            // Find first unused index in sorted list
            let nextNum = -1;
            for(let i=0; i<sorted.length; i++) {
                if(!usedIndexBySection[currentSectionIdx].has(i)) {
                    usedIndexBySection[currentSectionIdx].add(i);
                    nextNum = sorted[i];
                    break;
                }
            }

            if(nextNum !== -1) {
                currentBets.push(nextNum);
                found = true;
            } else {
                currentSectionIdx = (currentSectionIdx + 1) % 4;
                attempts++;
            }
        }
    }

    function updateUI() {
        // Update Table Highlighting
        document.querySelectorAll('.cell').forEach(c => c.classList.remove('betting'));
        currentBets.forEach(num => {
            const cell = document.getElementById(`cell-${num}`) || document.querySelector('.cell.green');
            if(num === 0) document.querySelector('.cell.green').classList.add('betting');
            else cell.classList.add('betting');
        });

        // Update Section Table
        const tbody = document.querySelector('#sectionData tbody');
        tbody.innerHTML = '';
        SEC_NAMES.forEach((name, idx) => {
            let sorted = [...SECTIONS[name]].sort((a, b) => (occurrenceMap[a] || 0) - (occurrenceMap[b] || 0));
            let coldest = sorted[0];
            let hottest = sorted[sorted.length - 1];
            
            tbody.innerHTML += `<tr>
                <td>${name}</td>
                <td>${coldest} (${occurrenceMap[coldest] || 0})</td>
                <td>${hottest} (${occurrenceMap[hottest] || 0})</td>
            </tr>`;
        });

        // Update Current Bets List
        const list = document.getElementById('betsList');
        list.innerHTML = currentBets.map(b => `<span class="bet-badge">${b}</span>`).join('');
    }

    initTable();
</script>
</body>
</html>

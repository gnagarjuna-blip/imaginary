<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Split-Asymmetric Physics Tracker</title>
    <style>
        :root { 
            --bg: #030712; 
            --panel: #0b1329; 
            --panel-border: #1e293b;
            --accent: #38bdf8; 
            --accent-glow: rgba(56, 189, 248, 0.12);
            --green: #10b981; 
            --red: #f43f5e; 
            --black: #334155; 
            --text: #f8fafc; 
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .dashboard { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr 390px; gap: 20px; }
        
        .table-section { background: #022c22; padding: 20px; border-radius: 16px; border: 1px solid #065f46; position: relative; overflow-x: auto; box-shadow: inset 0 0 20px rgba(0,0,0,0.7); }
        .roulette-board { display: flex; align-items: stretch; min-width: 800px; }
        
        .zero-container { width: 75px; background: var(--green); border: 1px solid rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; cursor: pointer; border-top-left-radius: 12px; border-bottom-left-radius: 12px; margin-right: 6px; }
        
        .numbers-grid { display: grid; grid-template-columns: repeat(12, 1fr); grid-template-rows: repeat(3, 1fr); gap: 4px; flex-grow: 1; }
        .cell { height: 55px; border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; cursor: pointer; transition: all 0.1s ease; border-radius: 6px; }
        .cell:hover { filter: brightness(1.2); border-color: rgba(255,255,255,0.5); }
        .r { background: var(--red); }
        .b { background: var(--black); }

        .panel { background: var(--panel); border-radius: 16px; padding: 20px; border: 1px solid var(--panel-border); }
        
        /* ASYMMETRIC SPECIAL HUD CARD */
        .prediction-hero { text-align: left; background: linear-gradient(135deg, #020617 0%, #0f172a 100%); border: 1px solid #2563eb; padding: 25px; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 0 25px var(--accent-glow); position: relative; }
        .pred-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.2em; color: #64748b; margin-bottom: 4px; font-weight: bold; }
        .pred-row { font-size: 1.9rem; font-weight: 800; margin-bottom: 12px; color: #ffffff; display: flex; align-items: center; justify-content: space-between; }
        .w-rate { font-size: 0.95rem; color: #4ade80; background: rgba(74, 222, 128, 0.1); padding: 4px 12px; border-radius: 20px; border: 1px solid rgba(74, 222, 128, 0.2); }
        .streak-txt-container { font-size: 1.1rem; font-weight: bold; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; color: #cbd5e1; }
        .w-letter { color: #4ade80; }
        .l-letter { color: #f43f5e; }
        
        .split-stats { display: flex; gap: 10px; margin: 12px 0; font-size: 0.8rem; text-transform: uppercase; }
        .split-tab { flex: 1; background: #020617; padding: 8px 12px; border-radius: 8px; border: 1px solid #1e293b; }
        .split-tab span { display: block; font-size: 1.1rem; font-weight: bold; color: var(--accent); margin-top: 2px; text-transform: none; }

        .neighbors-box { display: flex; justify-content: flex-start; gap: 6px; margin: 20px 0 5px 0; overflow-x: auto; padding: 5px 0; }
        .nb-cell { width: 34px; height: 34px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; border: 1px solid rgba(255,255,255,0.1); color: white; }
        .nb-center { border: 2px solid #fbbf24; transform: scale(1.15); box-shadow: 0 0 15px rgba(251,191,36,0.5); }
        
        .direction-panel { display: flex; gap: 10px; margin-bottom: 15px; background: #020617; padding: 12px; border-radius: 12px; border: 1px solid var(--panel-border); justify-content: space-between; align-items: center;}
        .dir-btn { flex: 1; padding: 10px; border: 1px solid #334155; background: #1e293b; color: #cbd5e1; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
        .dir-btn.active { background: #2563eb; color: white; border-color: #3b82f6; box-shadow: 0 0 12px rgba(37, 99, 235, 0.4); }

        .log-wrap { height: 280px; overflow-y: auto; margin-top: 15px; border-radius: 10px; background: #020617; border: 1px solid var(--panel-border); }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: #0f172a; color: #94a3b8; padding: 12px; position: sticky; top: 0; font-weight: 600; border-bottom: 1px solid var(--panel-border); }
        td { padding: 11px; text-align: center; border-bottom: 1px solid #1e293b; color: #cbd5e1; }

        .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 12px; font-size: 0.95rem; }
        .btn-primary { background: #2563eb; color: white; border: 1px solid #3b82f6; }
        .btn-danger { background: #111827; color: #f43f5e; border: 1px solid #311042; }
        
        .bulk-area { width: 100%; height: 65px; background: #020617; color: var(--accent); border: 1px solid var(--panel-border); border-radius: 8px; padding: 12px; box-sizing: border-box; font-family: monospace; resize: none; }
    </style>
</head>
<body>

<div class="dashboard">
    <div>
        <div class="table-section">
            <h2 style="margin:0 0 15px 0; font-size: 0.9rem; opacity: 0.7; letter-spacing: 0.05em;">LIVE WHEEL INPUT CAPTURE</h2>
            <div class="roulette-board">
                <div class="zero-container" onclick="trackSingleInput(0)">0</div>
                <div class="numbers-grid" id="boardGrid"></div>
            </div>
        </div>

        <div class="panel" style="margin-top: 20px;">
            <h2 style="margin:0; font-size: 1rem; color: #94a3b8;">DECOUPLED LOG SECTOR (NEWEST ON TOP)</h2>
            <div class="log-wrap">
                <table>
                    <thead>
                        <tr><th>Spin No.</th><th>Result</th><th>Rotor Path</th><th>Asymmetric Jump</th><th>Sector Verdict</th></tr>
                    </thead>
                    <tbody id="logTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div>
        <div class="direction-panel">
            <span class="next-indicator" style="font-size: 0.8rem; color: #94a3b8; font-weight: bold;">Next Rotor Release:</span>
            <div style="display:flex; gap: 5px; width: 65%;">
                <button id="btn-cw" class="dir-btn active" onclick="setInitialDirection('CW')">CLOCKWISE ↻</button>
                <button id="btn-ccw" class="dir-btn" onclick="setInitialDirection('CCW')">C-CLOCKWISE ↺</button>
            </div>
        </div>

        <div class="prediction-hero">
            <div class="pred-label">Asymmetric Vector Focus</div>
            <div class="pred-row">
                <span id="pred-notation">--</span> 
                <span class="w-rate" id="w-rate-display">0.0% HIT</span>
            </div>
            
            <div class="streak-txt-container">Dynamic Sequence: <span id="streak-txt-span">-</span></div>
            
            <div class="split-stats">
                <div class="split-tab">
                    CW Target Offset
                    <span id="cw-offset-val">-</span>
                </div>
                <div class="split-tab">
                    CCW Target Offset
                    <span id="ccw-offset-val">-</span>
                </div>
            </div>
            
            <div class="neighbors-box" id="neighbors-output"></div>
        </div>

        <div class="panel">
            <h2 style="margin:0 0 10px 0; font-size: 0.9rem; color: #94a3b8; text-transform: uppercase;">Stream Sourcing Capture</h2>
            
            <div style="margin: 10px 0 12px 0; font-size: 0.85rem; display: flex; justify-content: space-between; color: #64748b;">
                <span>Total Stream Size:</span>
                <span id="count-val" style="font-weight: bold; color: #cbd5e1;">0 spins</span>
            </div>
            
            <textarea id="bulkData" class="bulk-area" placeholder="Paste data row string (Top row = Newest spin)"></textarea>
            <button class="btn btn-primary" onclick="importHistory()">INJECT RAW STREAM</button>
            <button class="btn btn-danger" onclick="resetSession()">PURGE CALCULATOR</button>
        </div>
    </div>
</div>

<script>
    const wheelOrder = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];
    const reds = [1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36];
    
    let history = [];
    let dists = [];
    let spinDirections = []; 
    let predictedSectorsLog = []; 
    let outcomesLog = []; 

    let currentDirection = 'CW'; 

    function buildBoard() {
        const grid = document.getElementById('boardGrid');
        const rows = [
            [3, 6, 9, 12, 15, 18, 21, 24, 27, 30, 33, 36],
            [2, 5, 8, 11, 14, 17, 20, 23, 26, 29, 32, 35],
            [1, 4, 7, 10, 13, 16, 19, 22, 25, 28, 31, 34]
        ];

        rows.forEach(rowArr => {
            rowArr.forEach(n => {
                const cell = document.createElement('div');
                cell.className = `cell ${reds.includes(n) ? 'r' : 'b'}`;
                cell.innerText = n;
                cell.onclick = () => trackSingleInput(n);
                grid.appendChild(cell);
            });
        });
    }

    function setInitialDirection(dir) {
        currentDirection = dir;
        updateDirectionUI();
    }

    function updateDirectionUI() {
        document.getElementById('btn-cw').classList.toggle('active', currentDirection === 'CW');
        document.getElementById('btn-ccw').classList.toggle('active', currentDirection === 'CCW');
    }

    function get7Neighbors(centerNumber) {
        if(centerNumber === null || centerNumber === undefined) return [];
        let idx = wheelOrder.indexOf(centerNumber);
        let sector = [];
        for (let i = -7; i <= 7; i++) {
            let targetIdx = (idx + i + 37) % 37;
            sector.push(wheelOrder[targetIdx]);
        }
        return sector;
    }

    function trackSingleInput(num) {
        executeTrackingStep(num, false);
    }

    function executeTrackingStep(num, isBulkMode = false) {
        let currentActivePredictionSector = predictedSectorsLog.length > 0 ? predictedSectorsLog[0] : [];

        if (currentActivePredictionSector.length > 0) {
            if (currentActivePredictionSector.includes(num)) {
                outcomesLog.unshift("W");
            } else {
                outcomesLog.unshift("L");
            }
        } else {
            outcomesLog.unshift(null); 
        }

        spinDirections.unshift(currentDirection);

        if (history.length > 0) {
            const lastNum = history[0]; 
            const idxCurrent = wheelOrder.indexOf(num);
            const idxLast = wheelOrder.indexOf(lastNum);
            
            let travel = 0;
            if (currentDirection === 'CW') {
                travel = (idxCurrent - idxLast + 37) % 37;
            } else {
                travel = (idxLast - idxCurrent + 37) % 37;
            }
            dists.unshift(travel);
        } else {
            dists.unshift(0);
        }
        
        history.unshift(num);
        currentDirection = currentDirection === 'CW' ? 'CCW' : 'CW';
        updateDirectionUI();

        if (!isBulkMode) {
            processEngine();
        }
    }

    function importHistory() {
        const raw = document.getElementById('bulkData').value;
        const nums = raw.split(/[\s,]+/).map(Number).filter(n => !isNaN(n) && n >= 0 && n <= 36);
        
        if(nums.length === 0) return;

        resetSession();

        // Process sequentially from oldest to newest (Bottom of block up to Top)
        for(let i = nums.length - 1; i >= 0; i--) {
            executeTrackingStep(nums[i], true);
        }

        processEngine();
        document.getElementById('bulkData').value = '';
    }

    function getAsymmetricOffset(targetDir) {
        let isolatedJumps = [];
        
        // Loop backwards starting from the most recent calculated steps
        for (let i = 0; i < dists.length; i++) {
            // Check direction of entry spin that caused this jump distance
            if (spinDirections[i] === targetDir) {
                isolatedJumps.push(dists[i]);
            }
        }

        if (isolatedJumps.length === 0) return 0;

        // Process density weighting cluster extraction specifically across this data loop
        let localWeights = new Array(37).fill(0);
        let depthLimit = Math.min(isolatedJumps.length, 6);

        for (let j = 0; j < depthLimit; j++) {
            let localJumpValue = isolatedJumps[j];
            let structuralWeightValue = 6 - j; 

            for (let offset = -2; offset <= 2; offset++) {
                let checkPocket = (localJumpValue + offset + 37) % 37;
                let scaleModifier = 1 / (1 + Math.abs(offset));
                localWeights[checkPocket] += structuralWeightValue * scaleModifier;
            }
        }

        let highWeightVal = -1;
        let selectedLocalJump = 0;
        for (let p = 0; p < 37; p++) {
            if (localWeights[p] > highWeightVal) {
                highWeightVal = localWeights[p];
                selectedLocalJump = p;
            }
        }
        return selectedLocalJump;
    }

    function processEngine() {
        if (history.length < 4) {
            predictedSectorsLog.unshift([]);
            return updateUI();
         localWeights
        }

        // Extract totally isolated target tracks based on independent runtime channels
        let cwOptimalJump = getAsymmetricOffset('CW');
        let ccwOptimalJump = getAsymmetricOffset('CCW');

        // Select the active upcoming path parameter
        let activeTargetJumpOffset = (currentDirection === 'CW') ? cwOptimalJump : ccwOptimalJump;

        const lastIdx = wheelOrder.indexOf(history[0]);
        let predIdx = 0;

        if (currentDirection === 'CW') {
            predIdx = (lastIdx + activeTargetJumpOffset + 37) % 37;
        } else {
            predIdx = (lastIdx - activeTargetJumpOffset + 37) % 37;
        }

        const targetCenter = wheelOrder[predIdx];
        const targetSector = get7Neighbors(targetCenter);
        
        predictedSectorsLog.unshift(targetSector);
        updateUI(targetCenter, cwOptimalJump, ccwOptimalJump, targetSector);
    }

    function updateUI(prediction = null, cwJump = 0, ccwJump = 0, targetSector = []) {
        const validOutcomes = outcomesLog.filter(o => o !== null);
        
        let winRate = 0;
        if(validOutcomes.length > 0) {
            const wins = validOutcomes.filter(o => o === 'W').length;
            winRate = (wins / validOutcomes.length) * 100;
        }

        document.getElementById('cw-offset-val').innerText = `+${cwJump} slots`;
        document.getElementById('ccw-offset-val').innerText = `+${ccwJump} slots`;

        if(prediction !== null) {
            document.getElementById('pred-notation').innerHTML = `${prediction} <span style="font-size:0.95rem; font-weight:400; color:#475569;">(Zone Focus)</span>`;
            document.getElementById('w-rate-display').innerText = `${winRate.toFixed(1)}% HIT`;
        } else {
            document.getElementById('pred-notation').innerText = "--";
            document.getElementById('w-rate-display').innerText = "0.0% HIT";
        }

        document.getElementById('count-val').innerText = `${history.length} spins total`;

        const streakTxtSpan = document.getElementById('streak-txt-span');
        streakTxtSpan.innerHTML = '';
        if(validOutcomes.length === 0) {
            streakTxtSpan.innerText = '-';
        } else {
            const displayStreak = validOutcomes.slice(0, 8).reverse();
            displayStreak.forEach((outcome, idx) => {
                const space = idx < displayStreak.length - 1 ? ' ' : '';
                if(outcome === 'W') {
                    streakTxtSpan.innerHTML += `<span class="w-letter">✅</span>${space}`;
                } else {
                    streakTxtSpan.innerHTML += `<span class="l-letter">❌</span>${space}`;
                }
            });
        }

        const neighborsBox = document.getElementById('neighbors-output');
        neighborsBox.innerHTML = '';
        if (targetSector.length > 0) {
            targetSector.forEach((num, index) => {
                const colorClass = num === 0 ? 'var(--green)' : (reds.includes(num) ? 'var(--red)' : 'var(--black)');
                const isCenter = index === 7 ? 'nb-center' : '';
                neighborsBox.innerHTML += `<div class="nb-cell ${isCenter}" style="background: ${colorClass};">${num}</div>`;
            });
        }

        const tbody = document.getElementById('logTable');
        tbody.innerHTML = '';
        
        history.forEach((n, idx) => {
            const distance = dists[idx] ?? 0;
            const loggedDirection = spinDirections[idx] || "-";
            const totalSpinsCount = history.length;
            
            let outcomeVerdict = '<span style="opacity: 0.3;">-</span>';
            if (outcomesLog[idx] !== null && outcomesLog[idx] !== undefined) {
                outcomeVerdict = outcomesLog[idx] === 'W' 
                    ? '<span style="font-weight:bold; color:#4ade80">HIT ZONE</span>' 
                    : '<span style="color:#475569">MISS</span>';
            }

            tbody.innerHTML += `<tr>
                <td>#${totalSpinsCount - idx}</td>
                <td><b>${n}</b></td>
                <td><span style="font-size:0.8rem; font-weight:bold; color:#94a3b8">${loggedDirection}</span></td>
                <td>+${distance}</td>
                <td>${outcomeVerdict}</td>
            </tr>`;
        });
    }

    function resetSession() {
        history = []; 
        dists = [];
        spinDirections = [];
        predictedSectorsLog = [];
        outcomesLog = [];
        currentDirection = 'CW';
        updateDirectionUI();
        updateUI();
    }

    buildBoard();
</script>
</body>
</html>

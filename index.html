<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BIET - Pattern Source Tracker</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f7f6; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 95%; max-width: 1000px; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { padding: 18px; border-radius: 12px; border: 2px solid #e0e0e0; transition: all 0.4s ease; position: relative; }
        
        /* Highlighting the Source of the current result */
        .source-hit { border-color: #27ae60; background: #ebffef; transform: translateY(-5px); box-shadow: 0 5px 15px rgba(39,174,96,0.2); }
        .source-badge { position: absolute; top: -10px; right: 10px; background: #27ae60; color: white; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; display: none; }
        .source-hit .source-badge { display: block; }

        .meter-container { background: #ddd; height: 8px; border-radius: 4px; margin: 10px 0; }
        .meter-fill { background: #27ae60; height: 100%; width: 0%; border-radius: 4px; transition: width 0.6s; }
        .ds-badge { background: #2c3e50; color: white; padding: 3px 8px; border-radius: 4px; margin-right: 4px; font-size: 0.85em; font-weight: bold; }
        .history-bar { background: #2c3e50; color: white; padding: 15px; border-radius: 8px; margin: 20px 0; width: 100%; font-family: monospace; font-size: 1.1em; }
        .input-section { display: flex; gap: 10px; margin-bottom: 15px; }
        input { padding: 12px; border-radius: 6px; border: 1px solid #ccc; width: 100px; font-size: 18px; text-align: center; }
        button { padding: 12px 25px; background: #27ae60; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .result-meta { color: #555; font-size: 0.9em; margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align:center; color: #2c3e50;">🧬 Pattern Source Predictor</h2>
    
    <div class="input-section">
        <input type="number" id="spinInput" placeholder="Spin" min="0" max="36">
        <button onclick="handleSpin()">Submit Result</button>
    </div>

    <div class="history-bar" id="history">History: Waiting for data...</div>

    <div class="grid" id="predictionGrid"></div>
</div>

<script>
    let spins = [];
    let lastPredictions = {}; 
    let stats = {
        "Only (-)": { hits: 0, total: 0 }, "Only (- & -1)": { hits: 0, total: 0 },
        "Only (- & +1)": { hits: 0, total: 0 }, "Only (+)": { hits: 0, total: 0 },
        "Only (+ & -1)": { hits: 0, total: 0 }, "Only (+ & +1)": { hits: 0, total: 0 }
    };

    const terminalMap = {
        1:[8], 2:[7,9], 3:[8], 4:[11], 5:[10,12], 6:[11], 7:[2,9], 8:[1,3,13,15], 9:[2,14], 10:[5,17],
        11:[4,6,16,18], 12:[5,17], 13:[8,20], 14:[7,9,19,21], 15:[8,20], 16:[11,23], 17:[10,12,22,24],
        18:[11,23], 19:[14,26], 20:[13,15,25,27], 21:[14,26], 22:[17,29], 23:[16,18,28,30], 24:[17,29],
        25:[20,32], 26:[19,21,31,33], 27:[20,32], 28:[23,35], 29:[22,24,34,36], 30:[23,35], 31:[26],
        32:[25,27], 33:[26], 34:[29], 35:[28,30], 36:[29]
    };

    function getDS(num) { return num === 0 ? 0 : Math.ceil(num / 6); }

    function handleSpin() {
        const val = parseInt(document.getElementById('spinInput').value);
        if (isNaN(val) || val < 0 || val > 36) return;
        
        let winningOperators = [];

        // Identify which operator produced the result
        if (Object.keys(lastPredictions).length > 0) {
            for (let opName in lastPredictions) {
                stats[opName].total++;
                if (lastPredictions[opName].includes(val)) {
                    stats[opName].hits++;
                    winningOperators.push(opName);
                }
            }
        }

        spins.push(val);
        document.getElementById('spinInput').value = '';
        updateUI(winningOperators);
    }

    function updateUI(winningOps) {
        document.getElementById('history').innerText = "Sequence: " + spins.join(" → ");
        const grid = document.getElementById('predictionGrid');
        grid.innerHTML = '';

        if (spins.length < 2) return;

        const last = spins[spins.length - 1];
        const prev = spins[spins.length - 2];

        const ops = [
            { name: "Only (-)", res: Math.abs(last - prev) },
            { name: "Only (- & -1)", res: Math.abs(last - prev) - 1 },
            { name: "Only (- & +1)", res: Math.abs(last - prev) + 1 },
            { name: "Only (+)", res: (last + prev) },
            { name: "Only (+ & -1)", res: (last + prev) - 1 },
            { name: "Only (+ & +1)", res: (last + prev) + 1 }
        ];

        let newPredictions = {};

        ops.forEach(op => {
            const resultNum = op.res;
            const terminals = terminalMap[resultNum] || [];
            const targets = [resultNum, ...terminals].filter(n => n > 0 && n <= 36);
            newPredictions[op.name] = targets;

            const streets = [...new Set(targets.map(t => getDS(t)))];
            const hitRate = stats[op.name].total === 0 ? 0 : Math.round((stats[op.name].hits / stats[op.name].total) * 100);

            const card = document.createElement('div');
            card.className = 'card';
            
            // Highlight if THIS operator was the source of the result
            if (winningOps.includes(op.name)) {
                card.classList.add('source-hit');
            }

            card.innerHTML = `
                <div class="source-badge">LAST HIT SOURCE</div>
                <strong>${op.name}</strong>
                <div class="stats">Success Rate: ${hitRate}%</div>
                <div class="meter-container">
                    <div class="meter-fill" style="width: ${hitRate}%"></div>
                </div>
                <div class="result-meta">Predicted Terminals: ${targets.join(', ')}</div>
                <div style="margin-top:10px;">
                    ${streets.map(s => `<span class="ds-badge">DS ${s}</span>`).join('')}
                </div>
            `;
            grid.appendChild(card);
        });

        lastPredictions = newPredictions;
    }
</script>
</body>
</html>

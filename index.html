<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BIET - DS Double Street Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 95%; max-width: 1200px; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        /* Bankroll Header */
        .bankroll-inputs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; background: #ebf2f7; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; font-weight: bold; color: #2c3e50; margin-bottom: 5px; }
        .input-group input { width: 90%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 18px; font-weight: bold; }
        
        .bankroll-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat-card { background: #1a1a1a; color: white; padding: 12px; border-radius: 10px; text-align: center; border-bottom: 4px solid #3498db; }
        .stat-card small { display: block; font-size: 11px; margin-bottom: 5px; color: #bdc3c7; }
        .stat-card span { font-size: 18px; font-weight: bold; }
        .val-win { color: #2ecc71; }
        .val-loss { color: #e74c3c; }

        /* Betting Signal Box */
        .signal-box { background: #fff3e0; border: 2px solid #ff9800; padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: center; }
        .bet-label { font-weight: bold; color: #e65100; font-size: 14px; margin-bottom: 10px; display: block; }
        .ds-chip { background: #ff9800; color: white; padding: 8px 15px; border-radius: 5px; font-weight: bold; font-size: 18px; margin: 0 5px; display: inline-block; box-shadow: 0 3px 0 #bf7100; }
        .filter-note { font-size: 11px; color: #d35400; margin-top: 8px; font-weight: bold; }

        .number-panel { display: grid; grid-template-columns: repeat(13, 1fr); gap: 8px; margin-bottom: 20px; background: #1a1a1a; padding: 15px; border-radius: 10px; }
        .num-btn { padding: 15px 5px; border: none; border-radius: 4px; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 16px; }
        .btn-green { background: #27ae60; grid-row: span 3; }
        .btn-red { background: #c0392b; }
        .btn-black { background: #2c3e50; }

        .dashboard-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; width: 100%; }
        .last-hit-box { background: #e8f5e9; border: 1px solid #27ae60; padding: 10px 20px; border-radius: 8px; color: #1b5e20; font-weight: bold; flex-grow: 1; margin-right: 15px; }
        .reset-btn { background: #e74c3c; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
        .card { padding: 15px; border-radius: 12px; border: 2px solid #e0e0e0; position: relative; }
        .zone-hit { border-color: #27ae60; background: #f0fff4; }
        .ds-badge { background: #34495e; color: white; padding: 5px 10px; border-radius: 5px; margin-right: 5px; font-size: 0.85em; font-weight: bold; display: inline-block; margin-top: 5px;}
        .history-bar { background: #2c3e50; color: white; padding: 12px; border-radius: 8px; margin-bottom: 20px; width: 100%; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div class="bankroll-inputs">
        <div class="input-group"><label>Bankroll</label><input type="number" id="inputBankroll" value="1500" onchange="initBankroll()"></div>
        <div class="input-group"><label>Base Unit (Per DS)</label><input type="number" id="inputBase" value="20" onchange="initBankroll()"></div>
        <div class="input-group"><label>Target %</label><input type="number" id="inputTarget" value="10" onchange="initBankroll()"></div>
    </div>

    <div class="bankroll-stats">
        <div class="stat-card"><small>Bankroll</small><span id="statBankroll">1500.00</span></div>
        <div class="stat-card"><small>Session P/L</small><span id="statPL">0.00</span></div>
        <div class="stat-card"><small>Unit Level</small><span id="statStake">20 (1x)</span></div>
        <div class="stat-card"><small>Goal</small><span id="statGoal">+150.00</span></div>
    </div>

    <div class="signal-box" id="signalBox">
        <span class="bet-label">🎯 BETS TO PLACE FOR NEXT SPIN:</span>
        <div id="betList" class="no-bet">Waiting for data...</div>
        <div id="filterNote" class="filter-note"></div>
    </div>

    <div class="number-panel" id="numberPanel">
        <button class="num-btn btn-green" onclick="handleSpin(0)">0</button>
    </div>

    <div class="dashboard-meta">
        <div class="last-hit-box" id="patternSource">Status: Ready</div>
        <button class="reset-btn" onclick="resetSession()">Reset Session</button>
    </div>

    <div class="history-bar" id="history">History: Ready</div>
    <div class="grid" id="predictionGrid"></div>
</div>

<script>
    const redNumbers = [1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36];
    const terminalMap = {
        1:[8], 2:[7,9], 3:[8], 4:[11], 5:[10,12], 6:[11], 7:[2,9], 8:[1,3,13,15], 9:[2,14], 10:[5,17],
        11:[4,6,16,18], 12:[5,17], 13:[8,20], 14:[7,9,19,21], 15:[8,20], 16:[11,23], 17:[10,12,22,24],
        18:[11,23], 19:[14,26], 20:[13,15,25,27], 21:[14,26], 22:[17,29], 23:[16,18,28,30], 24:[17,29],
        25:[20,32], 26:[19,21,31,33], 27:[20,32], 28:[23,35], 29:[22,24,34,36], 30:[23,35], 31:[26],
        32:[25,27], 33:[26], 34:[29], 35:[28,30], 36:[29]
    };

    let spins = [];
    let activePredictions = {}; 
    let currentBankroll = 1500;
    let baseUnit = 20;
    let multiplier = 1;
    let sessionPL = 0;

    let stats = {
        "Only (-)": { streak: 0 },
        "Only (- & -1)": { streak: 0 },
        "Only (- & +1)": { streak: 0 },
        "Only (+)": { streak: 0 },
        "Only (+ & -1)": { streak: 0 },
        "Only (+ & +1)": { streak: 0 }
    };

    const panel = document.getElementById('numberPanel');
    for (let i = 1; i <= 36; i++) {
        const btn = document.createElement('button');
        btn.innerText = i;
        btn.className = `num-btn ${redNumbers.includes(i) ? 'btn-red' : 'btn-black'}`;
        btn.onclick = () => handleSpin(i);
        panel.appendChild(btn);
    }

    function initBankroll() {
        currentBankroll = parseFloat(document.getElementById('inputBankroll').value);
        baseUnit = parseFloat(document.getElementById('inputBase').value);
        document.getElementById('statBankroll').innerText = currentBankroll.toFixed(2);
        updateBankrollUI();
    }

    function getDS(num) { return num === 0 ? 0 : Math.ceil(num / 6); }

    function resetSession() {
        spins = []; activePredictions = {}; multiplier = 1; sessionPL = 0; initBankroll();
        for(let key in stats) stats[key].streak = 0;
        document.getElementById('history').innerText = "History: Reset";
        document.getElementById('predictionGrid').innerHTML = '';
        document.getElementById('betList').innerText = "Waiting for data...";
    }

    function updateBankrollUI() {
        document.getElementById('statBankroll').innerText = currentBankroll.toFixed(2);
        document.getElementById('statPL').innerText = sessionPL.toFixed(2);
        document.getElementById('statPL').className = sessionPL >= 0 ? 'val-win' : 'val-loss';
        document.getElementById('statStake').innerText = `${baseUnit * multiplier} (${multiplier}x)`;
    }

    function handleSpin(val) {
        const currentDS = getDS(val);
        let winningOps = [];
        let betActive = false;

        if (Object.keys(activePredictions).length > 0) {
            let uniqueDS = new Set();
            for (let op in activePredictions) activePredictions[op].forEach(d => uniqueDS.add(d));

            if (uniqueDS.size > 0) {
                betActive = true;
                let unitAmount = baseUnit * multiplier;
                let totalRisk = uniqueDS.size * unitAmount;
                let isHit = false;

                for (let opName in activePredictions) {
                    if (activePredictions[opName].includes(currentDS)) {
                        stats[opName].streak++;
                        winningOps.push(opName);
                        isHit = true;
                    } else {
                        stats[opName].streak = 0;
                    }
                }

                if (isHit) {
                    sessionPL += (unitAmount * 6) - totalRisk;
                    currentBankroll += (unitAmount * 6) - totalRisk;
                    if (multiplier > 1) multiplier--;
                } else {
                    sessionPL -= totalRisk; currentBankroll -= totalRisk;
                    multiplier++;
                }
            }
        }

        const sourceBox = document.getElementById('patternSource');
        sourceBox.innerText = betActive ? (winningOps.length > 0 ? `HIT: DS ${currentDS}` : `MISS: DS ${currentDS}`) : `Observation (DS ${currentDS})`;
        sourceBox.style.background = winningOps.length > 0 ? "#e8f5e9" : (betActive ? "#ffebee" : "#f0f2f5");

        spins.push(val);
        updateBankrollUI();
        generateAndDisplayNext(winningOps, currentDS);
    }

    function generateAndDisplayNext(winningOps, currentDS) {
        document.getElementById('history').innerText = "History: " + spins.slice(-10).join(" | ");
        const grid = document.getElementById('predictionGrid');
        grid.innerHTML = '';
        if (spins.length < 2) return;

        const last = spins[spins.length - 1];
        const prev = spins[spins.length - 2];
        const rawOps = [
            { name: "Only (-)", res: Math.abs(last - prev) },
            { name: "Only (- & -1)", res: Math.abs(last - prev) - 1 },
            { name: "Only (- & +1)", res: Math.abs(last - prev) + 1 },
            { name: "Only (+)", res: (last + prev) },
            { name: "Only (+ & -1)", res: (last + prev) - 1 },
            { name: "Only (+ & +1)", res: (last + prev) + 1 }
        ];

        // Process patterns and their associated DS
        let patternList = rawOps.map(op => {
            const terminals = terminalMap[op.res] || [];
            const targetDS = [...new Set([op.res, ...terminals].map(n => getDS(n)))].filter(d => d > 0 && d <= 6);
            return { ...op, ds: targetDS, currentStreak: stats[op.name].streak };
        });

        // 1. Filter patterns that actually have a DS prediction
        let activePatterns = patternList.filter(p => p.ds.length > 0);

        // 2. Sort patterns by streak (highest first) to pick the "most suitable"
        activePatterns.sort((a, b) => b.currentStreak - a.currentStreak);

        let finalBetDS = new Set();
        let selectedPatterns = {};
        let filteredDueToLimit = false;

        for (let p of activePatterns) {
            // Check how many unique DS we would have if we added this pattern
            let tempSet = new Set([...finalBetDS, ...p.ds]);
            
            if (tempSet.size <= 4) {
                p.ds.forEach(d => finalBetDS.add(d));
                selectedPatterns[p.name] = p.ds;
            } else {
                filteredDueToLimit = true;
            }
        }

        // Display Cards
        patternList.forEach(p => {
            const card = document.createElement('div');
            const isSelected = selectedPatterns[p.name] ? true : false;
            card.className = `card ${winningOps.includes(p.name) ? 'zone-hit' : ''}`;
            card.style.opacity = (p.ds.length > 0 && !isSelected) ? "0.5" : "1";
            card.innerHTML = `<strong>${p.name}</strong><br><small>Streak: ${p.currentStreak}</small><div>${p.ds.map(d => `<span class="ds-badge">DS ${d}</span>`).join('')}</div>`;
            grid.appendChild(card);
        });

        // Update Betting Signal Box
        const sortedDS = Array.from(finalBetDS).sort((a, b) => a - b);
        const betListDiv = document.getElementById('betList');
        const noteDiv = document.getElementById('filterNote');

        if (sortedDS.length > 0) {
            let unit = baseUnit * multiplier;
            betListDiv.innerHTML = sortedDS.map(d => `<div class="ds-chip">DS ${d}</div>`).join('') + 
                                   `<div style="margin-top:10px; font-weight:bold; color:#2c3e50">Total Bet: ${sortedDS.length * unit}</div>`;
            noteDiv.innerText = filteredDueToLimit ? "⚠️ Auto-filtered to top 4 DS based on pattern streaks." : "";
        } else {
            betListDiv.innerHTML = "<span class='no-bet'>No match found.</span>";
            noteDiv.innerText = "";
        }

        activePredictions = selectedPatterns;
    }
    initBankroll();
</script>
</body>
</html>

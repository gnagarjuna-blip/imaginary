<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BIET - DS Operator Tracker</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 95%; max-width: 1200px; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .bankroll-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat-card { background: #1a1a1a; color: white; padding: 12px; border-radius: 10px; text-align: center; border-bottom: 4px solid #3498db; }
        .stat-card span { font-size: 18px; font-weight: bold; display: block; }
        .signal-box { background: #fff3e0; border: 2px solid #ff9800; padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: center; min-height: 100px; }
        .op-tag { background: #2c3e50; color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 12px; margin-bottom: 10px; display: inline-block; }
        .ds-chip { background: #ff9800; color: white; padding: 10px 20px; border-radius: 5px; font-weight: bold; font-size: 24px; margin: 5px; display: inline-block; box-shadow: 0 4px 0 #bf7100; }
        .number-panel { display: grid; grid-template-columns: repeat(13, 1fr); gap: 6px; margin-bottom: 20px; background: #1a1a1a; padding: 15px; border-radius: 10px; }
        .num-btn { padding: 12px 0; border: none; border-radius: 4px; color: white; font-weight: bold; cursor: pointer; }
        .btn-red { background: #c0392b; } .btn-black { background: #2c3e50; } .btn-green { background: #27ae60; grid-row: span 3; }
        .history-bar { background: #2c3e50; color: white; padding: 10px; border-radius: 8px; margin-bottom: 15px; width: 100%; text-align: center; }
        .waiting-msg { color: #95a5a6; font-style: italic; font-size: 18px; }
    </style>
</head>
<body>

<div class="container">
    <div class="bankroll-stats">
        <div class="stat-card"><small>Bankroll</small><span id="statBankroll">1500.00</span></div>
        <div class="stat-card"><small>Profit/Loss</small><span id="statPL">0.00</span></div>
        <div class="stat-card"><small>Stake/DS</small><span id="statStake">20</span></div>
        <div class="stat-card"><small>Active Op</small><span id="statOp">NONE</span></div>
    </div>

    <div class="signal-box" id="signalBox">
        <div id="opIndicator"></div>
        <div id="betList"><span class="waiting-msg">ENTER AT LEAST 2 SPINS TO DETECT OPERATOR</span></div>
    </div>

    <div class="number-panel" id="numberPanel">
        <button class="num-btn btn-green" onclick="handleSpin(0)">0</button>
    </div>

    <div class="history-bar" id="history">Waiting for data...</div>
    <button onclick="resetSession()" style="background:#e74c3c; color:white; border:none; padding:10px 20px; border-radius:5px; cursor:pointer; font-weight:bold;">Reset</button>
</div>

<script>
    const redNumbers = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
    const terminalMap = {
        1:[8], 2:[7,9], 3:[8], 4:[11], 5:[10,12], 6:[11], 7:[2,9], 8:[1,3,13,15], 9:[2,14], 10:[5,17],
        11:[4,6,16,18], 12:[5,17], 13:[8,20], 14:[7,9,19,21], 15:[8,20], 16:[11,23], 17:[10,12,22,24],
        18:[11,23], 19:[14,26], 20:[13,15,25,27], 21:[14,26], 22:[17,29], 23:[16,18,28,30], 24:[17,29],
        25:[20,32], 26:[19,21,31,33], 27:[20,32], 28:[23,35], 29:[22,24,34,36], 30:[23,35], 31:[26],
        32:[25,27], 33:[26], 34:[29], 35:[28,30], 36:[29]
    };

    let spins = [];
    let currentBankroll = 1500;
    let baseUnit = 20;
    let sessionPL = 0;
    let currentBetDS = [];
    let lastActiveOp = null;

    // Build Panel
    const panel = document.getElementById('numberPanel');
    for (let i = 1; i <= 36; i++) {
        const btn = document.createElement('button');
        btn.innerText = i;
        btn.className = `num-btn ${redNumbers.includes(i) ? 'btn-red' : 'btn-black'}`;
        btn.onclick = () => handleSpin(i);
        panel.appendChild(btn);
    }

    function getDS(num) { 
        return (num > 0 && num <= 36) ? Math.ceil(num / 6) : null; 
    }

    function handleSpin(val) {
        // 1. Check Win/Loss
        if (currentBetDS.length > 0) {
            const spinDS = getDS(val);
            if (currentBetDS.includes(spinDS)) {
                let profit = (baseUnit * 6) - (currentBetDS.length * baseUnit);
                sessionPL += profit; currentBankroll += profit;
            } else {
                let loss = currentBetDS.length * baseUnit;
                sessionPL -= loss; currentBankroll -= loss;
            }
        }

        spins.push(val);
        updateUI();
        processLogic();
    }

    function processLogic() {
        if (spins.length < 2) return;

        const last = spins[spins.length - 1];
        const prev = spins[spins.length - 2];
        
        // Find which operator connects prev to last
        const possibleOps = [
            { name: "+10", target: prev + 10 },
            { name: "-10", target: prev - 10 },
            { name: "+1", target: prev + 1 },
            { name: "-1", target: prev - 1 }
        ];

        let detectedOp = null;
        for (let op of possibleOps) {
            let terminals = terminalMap[op.target] || [];
            if (last === op.target || terminals.includes(last)) {
                detectedOp = op.name;
                break;
            }
        }

        const betListDiv = document.getElementById('betList');
        const opIndicator = document.getElementById('opIndicator');

        if (detectedOp) {
            lastActiveOp = detectedOp;
            document.getElementById('statOp').innerText = detectedOp;
            
            // Apply detected operator to the LATEST result
            let nextTarget;
            if (detectedOp === "+10") nextTarget = last + 10;
            else if (detectedOp === "-10") nextTarget = last - 10;
            else if (detectedOp === "+1") nextTarget = last + 1;
            else if (detectedOp === "-1") nextTarget = last - 1;

            let nextTerminals = terminalMap[nextTarget] || [];
            let dsSet = [...new Set([nextTarget, ...nextTerminals].map(n => getDS(n)))].filter(d => d !== null);

            if (dsSet.length > 0 && dsSet.length <= 3) {
                currentBetDS = dsSet;
                opIndicator.innerHTML = `<span class="op-tag">DETECTED: ${detectedOp}</span>`;
                betListDiv.innerHTML = `<div style="color:#e65100; font-weight:bold; margin-bottom:5px;">NEXT PREDICTION:</div>` + 
                                       currentBetDS.sort().map(d => `<div class="ds-chip">DS ${d}</div>`).join('');
            } else {
                currentBetDS = [];
                opIndicator.innerHTML = `<span class="op-tag">WAITING</span>`;
                betListDiv.innerHTML = `<span class="waiting-msg">OPERATOR ${detectedOp} YIELDS > 3 DS. SKIPPING.</span>`;
            }
        } else {
            currentBetDS = [];
            document.getElementById('statOp').innerText = "NONE";
            opIndicator.innerHTML = "";
            betListDiv.innerHTML = `<span class="waiting-msg">NO MATCH FROM PREVIOUS. WAIT FOR NEXT.</span>`;
        }
    }

    function updateUI() {
        document.getElementById('statBankroll').innerText = currentBankroll.toFixed(2);
        document.getElementById('statPL').innerText = sessionPL.toFixed(2);
        document.getElementById('history').innerText = "History: " + spins.slice(-10).join(" | ");
    }

    function resetSession() {
        spins = []; currentBetDS = []; sessionPL = 0; lastActiveOp = null;
        document.getElementById('statOp').innerText = "NONE";
        document.getElementById('betList').innerHTML = `<span class="waiting-msg">ENTER AT LEAST 2 SPINS</span>`;
        updateUI();
    }
</script>
</body>
</html>

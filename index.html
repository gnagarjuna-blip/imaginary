<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Roulette Section Tracker</title>
    <style>
        :root {
            --casino-green: #00703c;
            --table-border: #ffffff;
            --cell-red: #d32f2f;
            --cell-black: #1a1a1a;
            --cell-zero: #2e7d32;
            --highlight: #ffeb3b;
        }

        body { font-family: 'Arial', sans-serif; background: #121212; color: white; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; }

        /* Bulk Input Styles */
        .setup-area { background: #222; padding: 15px; border-radius: 8px; margin-bottom: 20px; width: 100%; max-width: 800px; border: 1px solid #444; }
        textarea { width: 100%; height: 60px; background: #333; color: #00ff00; border: 1px solid #555; padding: 10px; box-sizing: border-box; resize: none; }
        .btn { background: #00703c; color: white; border: none; padding: 10px 20px; cursor: pointer; margin-top: 10px; border-radius: 4px; font-weight: bold; }
        .btn:hover { background: #00a050; }

        /* Roulette Table Grid Layout */
        .roulette-container { position: relative; background: var(--casino-green); padding: 20px; border: 10px solid #5d4037; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .betting-mat { display: grid; grid-template-columns: 60px repeat(12, 50px); grid-template-rows: repeat(3, 60px); gap: 2px; border: 2px solid var(--table-border); }
        
        .n0 { grid-row: 1 / span 3; background: var(--cell-zero); }
        .cell { display: flex; align-items: center; justify-content: center; font-size: 1.2em; font-weight: bold; cursor: pointer; position: relative; transition: all 0.1s; border: 1px solid rgba(255,255,255,0.2); }
        .cell:hover { opacity: 0.8; transform: scale(1.02); }
        .red { background: var(--cell-red); }
        .black { background: var(--cell-black); }
        
        /* Active Bet Marker */
        .active-bet::after {
            content: ''; position: absolute; width: 35px; height: 35px; 
            background: rgba(255, 235, 59, 0.6); border: 3px solid var(--highlight);
            border-radius: 50%; box-shadow: 0 0 10px #000;
        }

        /* Stats Dashboard */
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; width: 100%; max-width: 900px; margin-top: 20px; }
        .stat-card { background: #1e1e1e; padding: 15px; border-radius: 8px; border-bottom: 3px solid var(--casino-green); }
        .counter { font-size: 2em; color: var(--highlight); }
        .history-strip { margin-top: 10px; overflow-x: auto; white-space: nowrap; padding: 10px; background: #000; border-radius: 5px; }
        .history-item { display: inline-block; width: 30px; height: 30px; line-height: 30px; text-align: center; margin-right: 5px; border-radius: 50%; font-size: 0.8em; }
    </style>
</head>
<body>

    <div class="setup-area">
        <h3>Step 1: Data Initialization (Min 50 Spins)</h3>
        <textarea id="bulkInput" placeholder="Paste numbers here (e.g., 32, 15, 19...) or click the table below"></textarea>
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <button class="btn" onclick="processBulk()">Process Initial Data</button>
            <span id="spinCountText">Spins entered: 0 / 50</span>
        </div>
    </div>

    <div class="roulette-container">
        <div class="betting-mat" id="mat">
            <div class="cell n0" onclick="handleTableClick(0)">0</div>
            </div>
    </div>

    <div class="dashboard">
        <div class="stat-card">
            <div>Current Strategy Section</div>
            <div class="counter" id="activeSection">---</div>
        </div>
        <div class="stat-card">
            <div>Total Wins</div>
            <div class="counter" id="winCount">0</div>
        </div>
        <div class="stat-card">
            <div>Strategy Status</div>
            <div id="strategyStatus">Awaiting 50 spins...</div>
        </div>
    </div>

    <div class="history-strip" id="history">History: </div>

<script>
    const REDS = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
    const SECTIONS = {
        TIER: [27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33],
        ORPHILINE: [17, 34, 6, 1, 20, 14, 31, 9],
        VOISION: [22, 18, 29, 7, 28, 19, 4, 21, 2, 25],
        ZERO: [15, 32, 0, 26, 3, 35, 12]
    };
    const SEC_ORDER = ["TIER", "ORPHILINE", "VOISION", "ZERO"];

    let spins = [];
    let counts = {};
    let currentBets = [];
    let secIdx = 0;
    let usedInSec = {0: new Set(), 1: new Set(), 2: new Set(), 3: new Set()};
    let wins = 0;
    let isLive = false;

    function initMat() {
        const mat = document.getElementById('mat');
        // Roulette board is organized in 3 rows
        // Row 1: 3, 6, 9...
        // Row 2: 2, 5, 8...
        // Row 3: 1, 4, 7...
        for (let col = 1; col <= 12; col++) {
            for (let row = 3; row >= 1; row--) {
                const num = (col - 1) * 3 + row;
                const cell = document.createElement('div');
                cell.className = `cell ${REDS.includes(num) ? 'red' : 'black'}`;
                cell.id = `cell-${num}`;
                cell.style.gridColumn = col + 1;
                cell.style.gridRow = 4 - row;
                cell.innerText = num;
                cell.onclick = () => handleTableClick(num);
                mat.appendChild(cell);
            }
        }
    }

    function handleTableClick(n) {
        if (!isLive) {
            spins.push(n);
            updatePreLiveUI();
        } else {
            processSpin(n);
        }
    }

    function processBulk() {
        const input = document.getElementById('bulkInput').value;
        const nums = input.split(/[ ,]+/).filter(x => x !== "").map(Number);
        nums.forEach(n => { if(n >= 0 && n <= 36) spins.push(n); });
        
        if (spins.length >= 50) {
            startLiveMode();
        } else {
            updatePreLiveUI();
            alert(`Need ${50 - spins.length} more spins.`);
        }
    }

    function updatePreLiveUI() {
        document.getElementById('spinCountText').innerText = `Spins entered: ${spins.length} / 50`;
        updateHistory();
    }

    function startLiveMode() {
        isLive = true;
        document.querySelector('.setup-area').style.opacity = "0.5";
        document.getElementById('strategyStatus').innerText = "STRATEGY ACTIVE";
        
        // Initial Calculation
        spins.forEach(n => counts[n] = (counts[n] || 0) + 1);
        calculateNextBet();
        refreshUI();
    }

    function processSpin(n) {
        counts[n] = (counts[n] || 0) + 1;
        spins.push(n);

        if (currentBets.includes(n)) {
            wins++;
            resetAndCycle();
        } else {
            cycleSectionAndAdd();
        }
        refreshUI();
    }

    function calculateNextBet() {
        const name = SEC_ORDER[secIdx];
        const nums = SECTIONS[name];
        let sorted = [...nums].sort((a,b) => (counts[a]||0) - (counts[b]||0));
        
        for(let i=0; i<sorted.length; i++) {
            if(!usedInSec[secIdx].has(i)) {
                usedInSec[secIdx].add(i);
                currentBets.push(sorted[i]);
                break;
            }
        }
    }

    function cycleSectionAndAdd() {
        secIdx = (secIdx + 1) % 4;
        calculateNextBet();
    }

    function resetAndCycle() {
        currentBets = [];
        Object.keys(usedInSec).forEach(k => usedInSec[k].clear());
        secIdx = (secIdx + 1) % 4;
        calculateNextBet();
    }

    function refreshUI() {
        // Clear old highlights
        document.querySelectorAll('.cell').forEach(c => c.classList.remove('active-bet'));
        
        // Add highlights for current cold numbers
        currentBets.forEach(n => {
            const id = n === 0 ? 'cell-0' : `cell-${n}`;
            const el = n === 0 ? document.querySelector('.n0') : document.getElementById(id);
            if(el) el.classList.add('active-bet');
        });

        document.getElementById('winCount').innerText = wins;
        document.getElementById('activeSection').innerText = SEC_ORDER[secIdx];
        updateHistory();
    }

    function updateHistory() {
        const h = document.getElementById('history');
        const last10 = spins.slice(-15).reverse();
        h.innerHTML = 'History: ' + last10.map(n => {
            let color = n === 0 ? 'var(--cell-zero)' : (REDS.includes(n) ? 'var(--cell-red)' : 'var(--cell-black)');
            return `<span class="history-item" style="background:${color}">${n}</span>`;
        }).join('');
    }

    initMat();
</script>
</body>
</html>

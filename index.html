<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BIET - Gap-Free Roulette Tracker</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #080808; color: #eee; padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .header { grid-column: span 2; background: #1a1a1a; padding: 20px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; }
        
        .card { background: #111; padding: 20px; border-radius: 12px; border: 1px solid #222; min-height: 250px; }
        .p-border { border-top: 5px solid #3498db; }
        .u-border { border-top: 5px solid #e67e22; }
        
        .stat { font-size: 14px; color: #888; margin-bottom: 5px; }
        .val { font-size: 24px; font-weight: bold; font-family: monospace; color: #fff; }
        
        .notation-display { background: #000; padding: 15px; border-radius: 8px; margin-top: 15px; min-height: 80px; border: 1px inset #222; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .block { background: #1a1a1a; padding: 8px 12px; border-radius: 5px; border: 1px solid #333; font-size: 20px; font-weight: bold; position: relative; }
        .block span { font-size: 12px; color: #9b59b6; vertical-align: super; margin-left: 2px; }
        .block-pockets { display: block; font-size: 9px; color: #555; text-align: center; margin-top: 2px; }

        .btn-grid { grid-column: span 2; display: grid; grid-template-columns: repeat(13, 1fr); gap: 5px; margin: 20px 0; }
        .num-btn { padding: 15px 0; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: white; }
        .red { background: #c0392b; } .black { background: #2c3e50; } .green { background: #27ae60; grid-row: span 3; }
        
        .audit-bar { grid-column: span 2; background: rgba(39, 174, 96, 0.1); border: 1px solid #27ae60; padding: 10px; border-radius: 5px; text-align: center; font-size: 13px; font-weight: bold; }
        .error { background: rgba(231, 76, 60, 0.1); border-color: #e74c3c; color: #e74c3c; }
    </style>
</head>
<body>

<div class="container">
    <div class="dashboard">
        <div class="header">
            <div><label class="stat">MODE</label><div style="color:#f1c40f; font-weight:bold;">n9 MAX EXPANSION</div></div>
            <div style="text-align:center"><label class="stat">LAST HIT</label><div id="lastN" class="val">--</div></div>
            <div style="text-align:right">
                <label class="stat">LIMIT</label>
                <select id="maxN" onchange="processSpins()" style="background:#222; color:#fff; border:1px solid #444; padding:5px;">
                    <option value="3">n3</option><option value="5">n5</option><option value="9" selected>n9</option>
                </select>
            </div>
        </div>

        <div class="card p-border">
            <div class="stat">PREDICTED UNIQUE POCKETS</div>
            <div id="pCount" class="val">0</div>
            <div class="notation-display" id="pNot"></div>
        </div>

        <div class="card u-border">
            <div class="stat">UNPREDICTED (REMAINING)</div>
            <div id="uCount" class="val">0</div>
            <div class="notation-display" id="uNot"></div>
        </div>

        <div class="btn-grid" id="grid">
            <button class="num-btn green" onclick="press(0)">0</button>
        </div>

        <div id="audit" class="audit-bar">WHEEL SYNC: 0/37 (STABLE)</div>
    </div>
</div>

<script>
    const wheel = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];
    const terms = { 1:[8], 2:[7,9], 3:[8], 4:[11], 5:[10,12], 6:[11], 7:[2,9], 8:[1,3,13,15], 9:[2,14], 10:[5,17], 11:[4,6,16,18], 12:[5,17], 13:[8,20], 14:[7,9,19,21], 15:[8,20], 16:[11,23], 17:[10,12,22,24], 18:[11,23], 19:[14,26], 20:[13,15,25,27], 21:[14,26], 22:[17,29], 23:[16,18,28,30], 24:[17,29], 25:[20,32], 26:[19,21,31,33], 27:[20,32], 28:[23,35], 29:[22,24,34,36], 30:[23,35], 31:[26], 32:[25,27], 33:[26], 34:[29], 35:[28,30], 36:[29] };

    let spins = [];
    let currentP = [], currentU = [];

    const g = document.getElementById('grid');
    for(let i=1; i<=36; i++){
        let b = document.createElement('button');
        b.innerText = i;
        b.className = `num-btn ${[1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36].includes(i)?'red':'black'}`;
        b.onclick = () => press(i);
        g.appendChild(b);
    }

    function press(n) { spins.push(n); processSpins(); }

    function processSpins() {
        if(spins.length < 2) return;
        const last = spins[spins.length-1];
        const prev = spins[spins.length-2];
        const nLimit = parseInt(document.getElementById('maxN').value);
        
        let activeOp = null;
        for(let op of ["+10","-10","+1","-1"]) {
            let t = (op==="+10")?prev+10:(op==="-10")?prev-10:(op==="+1")?prev+1:prev-1;
            if(t>=0 && t<=36 && getCloud(t, nLimit).includes(last)) { activeOp = op; break; }
        }

        if(!activeOp) { clear(); return; }

        let target = (activeOp==="+10")?last+10:(activeOp==="-10")?last-10:(activeOp==="+1")?last+1:last-1;
        if(target < 0 || target > 36) { clear(); return; }

        // Logic: Calculate Unique Predicted Numbers
        let pSet = new Set();
        let roots = [target, ...(terms[target]||[])];
        roots.forEach(r => {
            let idx = wheel.indexOf(r);
            for(let i=-nLimit; i<=nLimit; i++) pSet.add(wheel[(idx+i+37)%37]);
        });
        currentP = Array.from(pSet);

        // Logic: Calculate Remaining (Unpredicted) Numbers
        currentU = wheel.filter(n => !currentP.includes(n));

        updateUI(last, roots, nLimit);
    }

    function getCloud(t, n) {
        let s = new Set();
        let pts = [t, ...(terms[t]||[])];
        pts.forEach(p => {
            let idx = wheel.indexOf(p);
            for(let i=-n; i<=n; i++) s.add(wheel[(idx+i+37)%37]);
        });
        return Array.from(s);
    }

    function getNotation(nums) {
        if(nums.length === 0) return "";
        let idxs = nums.map(n => wheel.indexOf(n)).sort((a,b)=>a-b);
        let blocks = [];
        if(idxs.length > 0) {
            let tmp = [idxs[0]];
            for(let i=1; i<idxs.length; i++) {
                if(idxs[i] === idxs[i-1]+1) tmp.push(idxs[i]);
                else { blocks.push(tmp); tmp = [idxs[i]]; }
            }
            blocks.push(tmp);
            if(idxs.includes(0) && idxs.includes(36) && blocks.length > 1) {
                let l = blocks.pop(); let f = blocks.shift(); blocks.push([...l, ...f]);
            }
        }
        return blocks.map(b => {
            let mid = b[Math.floor(b.length/2)];
            let nVal = Math.floor((b.length-1)/2);
            return `<div class="block">${wheel[mid]}<span>n${nVal}</span><small class="block-pockets">(${b.length} pockets)</small></div>`;
        }).join("");
    }

    function updateUI(last, roots, n) {
        document.getElementById('lastN').innerText = last;
        document.getElementById('pCount').innerText = currentP.length;
        document.getElementById('uCount').innerText = currentU.length;
        
        document.getElementById('pNot').innerHTML = roots.map(r => `<div class="block">${r}<span>n${n}</span></div>`).join("");
        document.getElementById('uNot').innerHTML = getNotation(currentU);
        
        let total = currentP.length + currentU.length;
        let audit = document.getElementById('audit');
        audit.innerText = `WHEEL SYNC: ${total}/37 NUMBERS (NO GAPS)`;
        audit.className = (total === 37) ? "audit-bar" : "audit-bar error";
    }

    function clear() {
        document.getElementById('pNot').innerHTML = "SCANNING...";
        document.getElementById('uNot').innerHTML = "SCANNING...";
    }
</script>
</body>
</html>

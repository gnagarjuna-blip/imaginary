<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BIET - High Freq Terminal Trigger</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #080808; color: #eee; padding: 20px; margin: 0; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 800px; }
        .grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        .header { background: #1a1a1a; padding: 15px; border-radius: 12px; border: 1px solid #333; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; align-items: center; }
        .config-group { display: flex; flex-direction: column; gap: 5px; }
        .card { background: #111; padding: 20px; border-radius: 12px; border: 1px solid #222; border-top: 5px solid #e74c3c; transition: border-color 0.3s; }
        .card.active { border-top-color: #2ecc71; }
        .freq-box { background: #1a1a1a; padding: 10px; border-radius: 8px; border: 1px solid #444; display: flex; justify-content: space-around; }
        .freq-item { text-align: center; padding: 5px 15px; border-radius: 6px; }
        .freq-leader { border: 1px solid #2ecc71; background: rgba(46, 204, 113, 0.1); }
        .freq-val { font-size: 18px; font-weight: bold; color: #f1c40f; display: block; }
        .freq-lbl { font-size: 9px; color: #777; text-transform: uppercase; }
        .fin-row { display: flex; justify-content: space-between; margin-bottom: 8px; border-bottom: 1px solid #222; padding-bottom: 5px; }
        .label { font-size: 10px; color: #777; text-transform: uppercase; letter-spacing: 1px; }
        .val { font-family: monospace; font-weight: bold; font-size: 18px; }
        .win { color: #2ecc71; } .loss { color: #e74c3c; }
        .notation-area { background: #000; padding: 15px; border-radius: 8px; margin-top: 15px; min-height: 60px; border: 1px inset #222; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;}
        .p-block { padding: 10px 20px; border-radius: 4px; font-size: 24px; font-weight: bold; border: 2px solid #2ecc71; color: #2ecc71; background: rgba(46, 204, 113, 0.1); }
        .num-grid { display: grid; grid-template-columns: repeat(13, 1fr); gap: 6px; margin: 15px 0; }
        .n-btn { padding: 12px 0; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; font-size: 16px; }
        .red { background: #c0392b; } .black { background: #2c3e50; } .green { background: #27ae60; grid-row: span 3; }
        input { background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; padding: 4px; }
        .status-msg { font-size: 11px; text-align: center; color: #777; margin-top: 8px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="grid">
        <div class="header">
            <div class="config-group">
                <span class="label">Last Number</span>
                <div id="lastNum" style="font-size:28px; font-weight:bold; color:#f1c40f">--</div>
            </div>
            <div class="config-group" style="text-align:right">
                <span class="label">Total Net P/L</span>
                <span id="netTotal" class="val">0.00</span>
                <span class="label" style="margin-top:5px">High Freq Op</span>
                <span id="activeOpLabel" style="color:#2ecc71; font-weight:bold; font-size:14px">NONE</span>
            </div>
        </div>

        <div class="freq-box">
            <div id="box+10" class="freq-item"><span class="freq-lbl">+10</span><span id="f+10" class="freq-val">0</span></div>
            <div id="box-10" class="freq-item"><span class="freq-lbl">-10</span><span id="f-10" class="freq-val">0</span></div>
            <div id="box+1" class="freq-item"><span class="freq-lbl">+1</span><span id="f+1" class="freq-val">0</span></div>
            <div id="box-1" class="freq-item"><span class="freq-lbl">-1</span><span id="f-1" class="freq-val">0</span></div>
        </div>

        <div class="card" id="mainCard">
            <span class="label">Triggered Terminal Prediction</span>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top:10px;">
                <div><span class="label">Base Unit</span><br><input type="number" id="pBase" value="10" style="width:80%"></div>
                <div><span class="label">Step (+)</span><br><input type="number" id="pStep" value="10" style="width:80%"></div>
            </div>
            <hr style="border:0; border-top:1px solid #222; margin:15px 0;">
            <div class="fin-row"><span class="label">Current Stake</span><span id="pStakeDisp" class="val">0</span></div>
            <div class="notation-area" id="pNot"></div>
            <div id="pStatus" class="status-msg">WAITING FOR FREQUENCY MATCH...</div>
        </div>

        <div class="num-grid" id="grid">
            <button class="n-btn green" onclick="inputNum(0)">0</button>
        </div>

        <div style="display: flex; gap: 10px;">
            <button onclick="undo()" style="background:#d35400; flex:1; padding:12px; color:white; border:0; border-radius:6px; cursor:pointer;">UNDO</button>
            <button onclick="location.reload()" style="background:#333; flex:1; padding:12px; color:white; border:0; border-radius:6px; cursor:pointer;">RESET</button>
        </div>
    </div>
</div>

<script>
    const termMap = { 1:[8], 2:[7,9], 3:[8], 4:[11], 5:[10,12], 6:[11], 7:[2,9], 8:[1,3,13,15], 9:[2,14], 10:[5,17], 11:[4,6,16,18], 12:[5,17], 13:[8,20], 14:[7,9,19,21], 15:[8,20], 16:[11,23], 17:[10,12,22,24], 18:[11,23], 19:[14,26], 20:[13,15,25,27], 21:[14,26], 22:[17,29], 23:[16,18,28,30], 24:[17,29], 25:[20,32], 26:[19,21,31,33], 27:[20,32], 28:[23,35], 29:[22,24,34,36], 30:[23,35], 31:[26], 32:[25,27], 33:[26], 34:[29], 35:[28,30], 36:[29] };
    
    let history = [], stateHistory = [];
    let fin = { pl: 0, stake: 0, streak: 0, activeNumbers: [] };

    const g = document.getElementById('grid');
    for(let i=1; i<=36; i++) {
        let b = document.createElement('button');
        b.innerText = i; b.className = `n-btn ${[1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36].includes(i)?'red':'black'}`;
        b.onclick = () => inputNum(i); g.appendChild(b);
    }

    function inputNum(n) {
        stateHistory.push(JSON.stringify({history, fin}));
        const base = parseInt(document.getElementById('pBase').value);
        const step = parseInt(document.getElementById('pStep').value);
        
        if (fin.activeNumbers.length > 0) {
            if(fin.stake === 0) fin.stake = base;
            if (fin.activeNumbers.includes(n)) {
                fin.pl += (fin.stake * 36) - (fin.activeNumbers.length * fin.stake);
                fin.streak = 0;
                fin.stake = Math.max(base, fin.stake - 4); 
            } else {
                fin.pl -= (fin.activeNumbers.length * fin.stake);
                fin.streak++;
                if(fin.streak % 4 === 0) fin.stake += step;
            }
        }

        history.push(n);
        let topOp = calculateFreq();
        process(topOp);
    }

    function calculateFreq() {
        let ops = {"+10":0, "-10":0, "+1":0, "-1":0};
        let start = Math.max(0, history.length - 20);
        
        for(let i = start; i < history.length - 1; i++) {
            let prev = history[i], curr = history[i+1];
            if (checkMapping(prev + 10, curr)) ops["+10"]++;
            if (checkMapping(prev - 10, curr)) ops["-10"]++;
            if (checkMapping(prev + 1, curr)) ops["+1"]++;
            if (checkMapping(prev - 1, curr)) ops["-1"]++;
        }

        let maxVal = -1, topOp = null;
        for(let op in ops) {
            document.getElementById('f'+op).innerText = ops[op];
            document.getElementById('box'+op).classList.remove('freq-leader');
            if(ops[op] > maxVal) { maxVal = ops[op]; topOp = op; }
        }
        
        if(maxVal > 0) {
            document.getElementById('box'+topOp).classList.add('freq-leader');
            document.getElementById('activeOpLabel').innerText = topOp;
            return topOp;
        }
        return null;
    }

    function checkMapping(target, actual) {
        if (!termMap[target]) return false;
        return termMap[target].includes(actual);
    }

    function process(topOp) {
        const last = history[history.length-1];
        const prev = history[history.length-2];
        document.getElementById('lastNum').innerText = last;
        fin.activeNumbers = [];
        const card = document.getElementById('mainCard');
        const status = document.getElementById('pStatus');

        if (history.length < 2 || !topOp) {
            status.innerText = "COLLECTING DATA...";
            card.classList.remove('active');
            updateUI(); return;
        }

        // STRICT CHECK: Did the move (prev -> last) follow the High Freq Operator?
        let moveFollowedFreq = false;
        if(topOp === "+10" && checkMapping(prev + 10, last)) moveFollowedFreq = true;
        if(topOp === "-10" && checkMapping(prev - 10, last)) moveFollowedFreq = true;
        if(topOp === "+1" && checkMapping(prev + 1, last)) moveFollowedFreq = true;
        if(topOp === "-1" && checkMapping(prev - 1, last)) moveFollowedFreq = true;

        if (moveFollowedFreq) {
            // Predict the terminals of the NEXT step using the High Freq Op
            let baseTarget;
            if(topOp === "+10") baseTarget = last + 10;
            else if(topOp === "-10") baseTarget = last - 10;
            else if(topOp === "+1") baseTarget = last + 1;
            else if(topOp === "-1") baseTarget = last - 1;

            if (termMap[baseTarget]) {
                fin.activeNumbers = termMap[baseTarget];
                status.innerText = `HOT PATTERN: ${topOp} DETECTED!`;
                status.style.color = "#2ecc71";
                card.classList.add('active');
            }
        } else {
            status.innerText = `WAITING FOR ${topOp} TERMINAL HIT...`;
            status.style.color = "#777";
            card.classList.remove('active');
        }
        
        updateUI();
    }

    function updateUI() {
        document.getElementById('netTotal').innerText = fin.pl.toFixed(2);
        document.getElementById('netTotal').className = `val ${fin.pl >= 0 ? 'win' : 'loss'}`;
        document.getElementById('pStakeDisp').innerText = fin.stake;
        document.getElementById('pNot').innerHTML = fin.activeNumbers
            .map(n => `<div class="p-block">${n}</div>`).join('');
    }

    function undo() {
        if(stateHistory.length > 0) {
            let prev = JSON.parse(stateHistory.pop());
            history = prev.history; fin = prev.fin; 
            calculateFreq(); updateUI();
        }
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BIET - Dual Strategy Tracker</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: #eee; padding: 15px; }
        .grid-main { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: #1a1a1a; padding: 20px; border-radius: 12px; border: 1px solid #333; }
        
        .header-panel { grid-column: span 2; display: flex; justify-content: space-between; align-items: center; background: #222; padding: 15px; border-radius: 10px; margin-bottom: 10px; }
        .op-tag { font-size: 24px; font-weight: bold; color: #f1c40f; }

        .stat-row { display: flex; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .val { font-weight: bold; }
        .win { color: #2ecc71; } .loss { color: #e74c3c; }

        .shorthand-box { background: #000; padding: 20px; border-radius: 8px; text-align: center; margin: 15px 0; min-height: 60px; }
        .notation { font-size: 28px; font-weight: bold; color: #3498db; letter-spacing: 1px; }
        .unpred-color { color: #9b59b6; }

        .number-panel { grid-column: span 2; display: grid; grid-template-columns: repeat(13, 1fr); gap: 5px; margin: 15px 0; }
        .num-btn { padding: 15px 0; border: none; border-radius: 4px; color: white; font-weight: bold; cursor: pointer; }
        .btn-red { background: #c0392b; } .btn-black { background: #2c3e50; } .btn-green { background: #27ae60; grid-row: span 3; }
        
        label { font-size: 12px; color: #888; text-transform: uppercase; }
    </style>
</head>
<body>

<div class="grid-main">
    <div class="header-panel">
        <div><label>Active Operator</label><div id="activeOp" class="op-tag">WAITING</div></div>
        <div style="text-align:right">
            <label>Neighbors (n)</label><br>
            <select id="nVal" style="background:#333; color:white; border:none; padding:5px; border-radius:4px;">
                <option value="1">1</option><option value="2">2</option><option value="3" selected>3</option>
                <option value="4">4</option><option value="5">5</option>
            </select>
        </div>
    </div>

    <div class="card" style="border-top: 4px solid #f1c40f;">
        <div class="stat-row"><span>PREDICTION (HOT)</span><span id="pStat" class="val">--</span></div>
        <div class="stat-row"><label>P/L</label><span id="pPL" class="val">0.00</span></div>
        <div class="stat-row"><label>Next Stake</label><span id="pStake" class="val">5</span></div>
        <div class="shorthand-box">
            <div id="pNotation" class="notation">---</div>
        </div>
    </div>

    <div class="card" style="border-top: 4px solid #9b59b6;">
        <div class="stat-row"><span>UNPREDICTED (GAPS)</span><span id="uStat" class="val">--</span></div>
        <div class="stat-row"><label>P/L</label><span id="uPL" class="val">0.00</span></div>
        <div class="stat-row"><label>Next Stake</label><span id="uStake" class="val">5</span></div>
        <div class="shorthand-box">
            <div id="uNotation" class="notation unpred-color">---</div>
        </div>
    </div>

    <div class="number-panel" id="numberPanel">
        <button class="num-btn btn-green" onclick="handleSpin(0)">0</button>
    </div>
</div>

<script>
    const wheel = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];
    const terminalMap = { 1:[8], 2:[7,9], 3:[8], 4:[11], 5:[10,12], 6:[11], 7:[2,9], 8:[1,3,13,15], 9:[2,14], 10:[5,17], 11:[4,6,16,18], 12:[5,17], 13:[8,20], 14:[7,9,19,21], 15:[8,20], 16:[11,23], 17:[10,12,22,24], 18:[11,23], 19:[14,26], 20:[13,15,25,27], 21:[14,26], 22:[17,29], 23:[16,18,28,30], 24:[17,29], 25:[20,32], 26:[19,21,31,33], 27:[20,32], 28:[23,35], 29:[22,24,34,36], 30:[23,35], 31:[26], 32:[25,27], 33:[26], 34:[29], 35:[28,30], 36:[29] };

    let spins = [];
    let state = {
        p: { pl: 0, stake: 5, activeNums: [] },
        u: { pl: 0, stake: 5, activeNums: [] }
    };

    const panel = document.getElementById('numberPanel');
    for (let i = 1; i <= 36; i++) {
        const btn = document.createElement('button');
        btn.innerText = i;
        btn.className = `num-btn ${[1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36].includes(i) ? 'btn-red' : 'btn-black'}`;
        btn.onclick = () => handleSpin(i);
        panel.appendChild(btn);
    }

    function handleSpin(val) {
        // 1. Check Win/Loss for both sides
        resolveBet('p', val);
        resolveBet('u', val);

        spins.push(val);
        processLogic();
        updateUI();
    }

    function resolveBet(side, val) {
        if (state[side].activeNums.length === 0) return;
        if (state[side].activeNums.includes(val)) {
            state[side].pl += (state[side].stake * 36) - (state[side].activeNums.length * state[side].stake);
            state[side].stake = 5; // Reset progression on win
        } else {
            state[side].pl -= (state[side].activeNums.length * state[side].stake);
            state[side].stake += 5; // Simple linear progression on loss
        }
    }

    function processLogic() {
        if (spins.length < 2) return;
        const last = spins[spins.length - 1];
        const prev = spins[spins.length - 2];
        const n = parseInt(document.getElementById('nVal').value);

        const ops = [{id:"+10", r:prev+10}, {id:"-10", r:prev-10}, {id:"+1", r:prev+1}, {id:"-1", r:prev-1}];
        let matched = ops.find(o => [o.r, ...(terminalMap[o.r]||[])].includes(last));

        if (!matched) { document.getElementById('activeOp').innerText = "WAITING"; return; }
        document.getElementById('activeOp').innerText = matched.id;

        let nextTarget = matched.id === "+10" ? last+10 : matched.id === "-10" ? last-10 : matched.id === "+1" ? last+1 : last-1;
        if (nextTarget < 0 || nextTarget > 36) return;

        // Calculate Predicted Set
        let pPoints = [nextTarget, ...(terminalMap[nextTarget]||[])];
        let pSet = new Set();
        pPoints.forEach(pt => {
            let idx = wheel.indexOf(pt);
            for(let i=-n; i<=n; i++) pSet.add(wheel[(idx+i+37)%37]);
        });
        state.p.activeNums = Array.from(pSet);

        // Calculate Unpredicted Set
        let uSet = wheel.filter(num => !pSet.has(num));
        state.u.activeNums = uSet;

        // Generate Notation
        document.getElementById('pNotation').innerText = pPoints.map(x => `${x}nsquare${n}`).join(" | ");
        document.getElementById('uNotation').innerText = getUnpredictedNotation(uSet);
    }

    function getUnpredictedNotation(nums) {
        if (nums.length === 0) return "FULL COVER";
        // Logic to find continuous blocks on the wheel
        let indices = nums.map(n => wheel.indexOf(n)).sort((a,b) => a-b);
        let blocks = [];
        if (indices.length > 0) {
            let temp = [indices[0]];
            for(let i=1; i<indices.length; i++) {
                if(indices[i] === indices[i-1]+1) temp.push(indices[i]);
                else { blocks.push(temp); temp = [indices[i]]; }
            }
            blocks.push(temp);
            // Wrap check
            if (indices.includes(0) && indices.includes(36)) {
                let last = blocks.pop(); let first = blocks.shift();
                blocks.push([...last, ...first]);
            }
        }
        return blocks.map(b => {
            let center = wheel[b[Math.floor(b.length/2)]];
            let nVal = Math.floor((b.length - 1)/2);
            return `${center}nsquare${nVal}`;
        }).join(" | ");
    }

    function updateUI() {
        ['p', 'u'].forEach(s => {
            document.getElementById(`${s}PL`).innerText = state[s].pl.toFixed(2);
            document.getElementById(`${s}PL`).className = `val ${state[s].pl >= 0 ? 'win' : 'loss'}`;
            document.getElementById(`${s}Stake`).innerText = state[s].stake;
            document.getElementById(`${s}Stat`).innerText = state[s].activeNums.length + " Nos";
        });
    }
</script>
</body>
</html>

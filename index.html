<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Attendance System</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #16a34a;
            --danger: #dc2626;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background: var(--card-bg);
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            text-align: center;
            width: 100%;
            max-width: 400px;
            transition: all 0.3s ease;
        }

        h2 {
            margin-top: 0;
            color: #0f172a;
            font-size: 1.6rem;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            color: #475569;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: all 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            color: white;
        }

        button:active {
            transform: scale(0.99);
        }

        .btn-primary {
            background-color: var(--primary);
        }
        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        /* Attendance System Dashboard (Hidden initially) */
        #attendance-system {
            display: none;
        }

        .clock {
            font-size: 2.8rem;
            font-weight: 700;
            margin: 15px 0 5px 0;
            color: var(--primary);
            font-variant-numeric: tabular-nums;
        }

        .date {
            color: #64748b;
            margin-bottom: 30px;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .btn-group {
            display: flex;
            gap: 15px;
        }

        .btn-checkin { background-color: var(--success); }
        .btn-checkout { background-color: var(--danger); }

        /* Error and Status Handlers */
        .error-msg {
            color: var(--danger);
            font-size: 0.85rem;
            margin-top: 5px;
            display: none;
            text-align: left;
        }

        #status-log {
            margin-top: 25px;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
        }
        .success-log { 
            background: #dcfce7; 
            color: #15803d; 
            border: 1px solid #bbf7d0;
        }
    </style>
</head>
<body>

    <div class="card" id="login-gateway">
        <h2>Corporate Gateway</h2>
        <form id="gate-form" onsubmit="verifyGateway(event)">
            <div class="form-group">
                <label for="user-email">Domain Email Address</label>
                <input type="email" id="user-email" placeholder="name@yourcompany.com" required>
                <div class="error-msg" id="email-error">Invalid corporate domain email address.</div>
            </div>
            <div class="form-group">
                <label for="user-password">Password</label>
                <input type="password" id="user-password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-primary">Verify & Enter</button>
        </form>
    </div>

    <div class="card" id="attendance-system">
        <h2>Workplace Attendance</h2>
        <div class="clock" id="live-clock">00:00:00 AM</div>
        <div class="date" id="live-date">Loading date...</div>

        <div class="form-group">
            <label for="employee-id">Employee ID / Name</label>
            <input type="text" id="employee-id" id="active-user" readonly>
        </div>

        <div class="btn-group">
            <button class="btn-checkin" onclick="logAttendance('Clock-In')">Clock In</button>
            <button class="btn-checkout" onclick="logAttendance('Clock-Out')">Clock Out</button>
        </div>

        <div id="status-log"></div>
    </div>

    <script>
        // CONFIGURATION: Set your specific allowed email domain here
        const ALLOWED_DOMAIN = "aloricaservices.com"; 

        let authenticatedUserEmail = "";

        // 1. Gateway Email & Password Validation Rule
        function verifyGateway(event) {
            event.preventDefault(); // Stop page refresh
            
            const emailInput = document.getElementById('user-email').value.trim();
            const passwordInput = document.getElementById('user-password').value;
            const emailError = document.getElementById('email-error');

            // Extract the domain segment from the typed email address
            const emailDomain = emailInput.substring(emailInput.lastIndexOf("@") + 1).toLowerCase();

            // Check if the domain matches perfectly
            if (emailDomain === ALLOWED_DOMAIN.toLowerCase()) {
                emailError.style.display = 'none';
                authenticatedUserEmail = emailInput;
                
                // Transition UI: Hide Login, Show Attendance Machine
                document.getElementById('login-gateway').style.display = 'none';
                document.getElementById('attendance-system').style.display = 'block';
                
                // Pre-populate the user field dynamically with their verified email prefix
                document.getElementById('employee-id').value = emailInput.split('@')[0].toUpperCase();
                
                // Boot live timing engine
                initClockSystem();
            } else {
                // Show unauthorized access domain warning
                emailError.textContent = `Access Denied. Only @${ALLOWED_DOMAIN} accounts are authorized.`;
                emailError.style.display = 'block';
            }
        }

        // 2. Real-time clock initialization 
        function initClockSystem() {
            function updateClock() {
                const now = new Date();
                document.getElementById('live-clock').textContent = now.toLocaleTimeString([], {
                    hour: '2-digit', minute: '2-digit', second: '2-digit'
                });
                document.getElementById('live-date').textContent = now.toLocaleDateString([], {
                    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
                });
            }
            setInterval(updateClock, 1000);
            updateClock();
        }

        // 3. Log Working Hours Action (Clock In / Clock Out)
        function logAttendance(statusType) {
            const userIdentifier = document.getElementById('employee-id').value;
            const timestamp = new Date();
            const statusLog = document.getElementById('status-log');

            statusLog.className = "success-log";
            statusLog.style.display = "block";
            statusLog.innerHTML = `<strong>Logged!</strong> ${userIdentifier} marked <b>${statusType}</b> at ${timestamp.toLocaleTimeString()}.`;

            // Ready for Backend Storage payload structure:
            console.log("Transmission Data Target API:", {
                user: authenticatedUserEmail,
                action: statusType,
                exact_time: timestamp.toISOString()
            });
        }
    </script>
</body>
</html>

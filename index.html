<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BIET - Operator Lock & Frequency Pro</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #080808; color: #eee; padding: 20px; margin: 0; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 1000px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .header { grid-column: span 2; background: #1a1a1a; padding: 15px; border-radius: 12px; border: 1px solid #333; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; align-items: center; }
        .card { background: #111; padding: 20px; border-radius: 12px; border: 1px solid #222; position: relative; min-height: 350px; }
        .p-card { border-top: 5px solid #3498db; }
        .u-card { border-top: 5px solid #e67e22; }
        
        .freq-box { grid-column: span 2; background: #1a1a1a; padding: 15px; border-radius: 8px; border: 1px solid #444; display: flex; justify-content: space-around; align-items: center; }
        .freq-item { text-align: center; padding: 5px 15px; border-radius: 6px; transition: all 0.3s; border: 1px solid transparent; }
        /* Highlight Class */
        .freq-active { background: rgba(241, 196, 15, 0.1); border: 1px solid #f1c40f; box-shadow: 0 0 10px rgba(241, 196, 15, 0.3); }
        .freq-val { font-size: 20px; font-weight: bold; color: #f1c40f; display: block; }
        .freq-lbl { font-size: 10px; color: #777; text-transform: uppercase; }

        .fin-row { display: flex; justify-content: space-between; margin-bottom: 8px; border-bottom: 1px solid #222; padding-bottom: 5px; }
        .label { font-size: 10px; color: #777; text-transform: uppercase; letter-spacing: 1px; }
        .val { font-family: monospace; font-weight: bold; font-size: 18px; }
        .win { color: #2ecc71; } .loss { color: #e74c3c; }
        
        .notation-area { background: #000; padding: 10px; border-radius: 8px; margin-top: 15px; min-height: 100px; border: 1px inset #222; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-content: flex-start; }
        .n-block { background: #1a1a1a; padding: 6px; border-radius: 6px; border: 1px solid #333; font-size: 14px; font-weight: bold; color: #3498db; }
        .u-block { background: #1a1a1a; padding: 6px; border-radius: 6px; border: 1px solid #333; font-size: 14px; font-weight: bold; color: #e67e22; }

        .num-grid { grid-column: span 2; display: grid; grid-template-columns: repeat(13, 1fr); gap: 6px; margin: 15px 0; }
        .n-btn { padding: 12px 0; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; font-size: 16px; }
        .red { background: #c0392b; } .black { background: #2c3e50; } .green { background: #27ae60; grid-row: span 3; }
        .footer-tools { grid-column: span 2; display: flex; gap: 10px; }
        .tool-btn { flex: 1; padding: 12px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; color: white; }
        .btn-undo { background: #d35400; } .btn-reset { background: #333; }
        select, input[type="number"] { background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; padding: 5px; width: 100%; font-size: 12px; }
        .history-strip { grid-column: span 2; background: #111; padding: 10px; border-radius: 8px; border: 1px solid #222; font-family: monospace; overflow-x: auto; font-size: 12px; }
        .prog-settings { display: flex; gap: 5px; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="grid">
        <div class="header">
            <div><span class="label">Bet Mode</span><br>
                <select id="betType" onchange="fullReset()">
                    <option value="straight">Straight Up (Nbr)</option>
                    <option value="streets">Streets (Acc)</option>
                    <option value="double" selected>Double Streets (No Acc)</option>
                </select>
            </div>
            <div><span class="label">Op Lock</span><br>
                <select id="opLock" onchange="process()">
                    <option value="AUTO">AUTO SCAN</option>
                    <option value="+10">+10 Lock</option>
                    <option value="-10">-10 Lock</option>
                    <option value="+1">+1 Lock</option>
                    <option value="-1">-1 Lock</option>
                </select>
            </div>
            <div style="text-align:center"><span class="label">Last Ball</span><div id="lastNum" style="font-size:24px; font-weight:bold; color:#f1c40f">--</div></div>
            <div><span class="label">Exp</span><br>
                <select id="nExp" onchange="process()">
                    <option value="0">n0</option><option value="1">n1</option><option value="2" selected>n2</option>
                    <option value="3">n3</option><option value="4">n4</option><option value="5">n5</option>
                </select>
            </div>
        </div>

        <div class="freq-box">
            <div id="box+10" class="freq-item"><span class="freq-lbl">+10 Hit</span><span id="f+10" class="freq-val">0</span></div>
            <div id="box-10" class="freq-item"><span class="freq-lbl">-10 Hit</span><span id="f-10" class="freq-val">0</span></div>
            <div id="box+1" class="freq-item"><span class="freq-lbl">+1 Hit</span><span id="f+1" class="freq-val">0</span></div>
            <div id="box-1" class="freq-item"><span class="freq-lbl">-1 Hit</span><span id="f-1" class="freq-val">0</span></div>
            <div class="freq-item"><span class="freq-lbl">Sample</span><span id="fSamp" class="freq-val">0/14</span></div>
        </div>

        <div class="card p-card">
            <div class="fin-row">
                <div style="width:100%">
                    <span class="label">Stake Controls</span>
                    <div class="prog-settings">
                        <input type="number" id="pBase" value="10" title="Base Unit">
                        <select id="pLossProg" title="Loss Progression Step">
                            <option value="0">L: 0 (Flat)</option>
                            <option value="1" selected>L: +1</option><option value="2">L: +2</option><option value="3">L: +3</option>
                            <option value="4">L: +4</option><option value="5">L: +5</option><option value="6">L: +6</option>
                            <option value="8">L: +8</option><option value="10">L: +10</option><option value="12">L: +12</option>
                        </select>
                        <select id="pWinProg" title="Win Reduction Step">
                            <option value="0">W: Reset</option>
                            <option value="1">W: -1</option><option value="2">W: -2</option><option value="3">W: -3</option>
                            <option value="4">W: -4</option><option value="5">W: -5</option><option value="6">W: -6</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="fin-row"><span class="label">P/L</span><span id="pPL" class="val">0.00</span></div>
            <div class="fin-row"><span class="label">Stake</span><span id="pStakeDisp" class="val" style="color:#3498db">10</span></div>
            <div class="fin-row"><span class="label">Win%</span><span id="pPct" class="val">0%</span></div>
            <div class="notation-area" id="pNot"></div>
        </div>

        <div class="card u-card">
            <div class="fin-row">
                <div style="width:100%">
                    <span class="label">Stake Controls</span>
                    <div class="prog-settings">
                        <input type="number" id="uBase" value="10">
                        <select id="uLossProg">
                            <option value="0">L: 0</option><option value="1" selected>L: +1</option><option value="2">L: +2</option>
                            <option value="4">L: +4</option><option value="6">L: +6</option><option value="12">L: +12</option>
                        </select>
                        <select id="uWinProg">
                            <option value="0">W: Reset</option><option value="1">W: -1</option><option value="6">W: -6</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="fin-row"><span class="label">P/L</span><span id="uPL" class="val">0.00</span></div>
            <div class="fin-row"><span class="label">Stake</span><span id="uStakeDisp" class="val" style="color:#e67e22">10</span></div>
            <div class="fin-row"><span class="label">Win%</span><span id="uPct" class="val">0%</span></div>
            <div class="notation-area" id="uNot"></div>
        </div>

        <div class="num-grid" id="grid"><button class="n-btn green" onclick="inputNum(0)">0</button></div>
        <div class="history-strip" id="histStrip">History: ...</div>
        <div class="footer-tools">
            <button class="tool-btn btn-undo" onclick="undo()">UNDO LAST</button>
            <button class="tool-btn btn-reset" onclick="location.reload()">RESET SESSION</button>
        </div>
    </div>
</div>

<script>
    const wheel = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];
    const neighbors = { 1:[8], 2:[7,9], 3:[8], 4:[11], 5:[10,12], 6:[11], 7:[2,9], 8:[1,3,13,15], 9:[2,14], 10:[5,17], 11:[4,6,16,18], 12:[5,17], 13:[8,20], 14:[7,9,19,21], 15:[8,20], 16:[11,23], 17:[10,12,22,24], 18:[11,23], 19:[14,26], 20:[13,15,25,27], 21:[14,26], 22:[17,29], 23:[16,18,28,30], 24:[17,29], 25:[20,32], 26:[19,21,31,33], 27:[20,32], 28:[23,35], 29:[22,24,34,36], 30:[23,35], 31:[26], 32:[25,27], 33:[26], 34:[29], 35:[28,30], 36:[29] };

    let history = [], stateHistory = [];
    let fin = { 
        p: { pl: 0, stake: 10, wins: 0, activeNumbers: [], activeGroups: [], activeRoots: [] }, 
        u: { pl: 0, stake: 10, wins: 0, activeNumbers: [], activeGroups: [] },
        totalBets: 0 
    };

    const g = document.getElementById('grid');
    for(let i=1; i<=36; i++) {
        let b = document.createElement('button');
        b.innerText = i; b.className = `n-btn ${[1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36].includes(i)?'red':'black'}`;
        b.onclick = () => inputNum(i); g.appendChild(b);
    }

    function fullReset() { history = []; stateHistory = []; clearZones(); updateUI(); }

    function inputNum(n) {
        stateHistory.push(JSON.stringify({history, fin}));
        const mode = document.getElementById('betType').value;

        ['p', 'u'].forEach(side => {
            if (fin[side].activeNumbers.length > 0) {
                if(side === 'p') fin.totalBets++;
                
                let base = parseInt(document.getElementById(side+'Base').value);
                let lossStep = parseInt(document.getElementById(side+'LossProg').value);
                let winStep = parseInt(document.getElementById(side+'WinProg').value);
                
                let multiplier = (mode === 'straight') ? 36 : (mode === 'streets' ? 12 : 6);
                let betCount = (mode === 'straight') ? fin[side].activeNumbers.length : fin[side].activeGroups.length;

                if (fin[side].activeNumbers.includes(n)) {
                    fin[side].pl += (fin[side].stake * multiplier) - (betCount * fin[side].stake);
                    fin[side].wins++;
                    // Win Logic: If winStep is 0, reset to base. Else subtract step.
                    if(winStep === 0) fin[side].stake = base;
                    else fin[side].stake = Math.max(base, fin[side].stake - (base * winStep));
                } else {
                    fin[side].pl -= (betCount * fin[side].stake);
                    // Loss Logic: Add base * lossStep
                    fin[side].stake += (base * lossStep);
                }
            }
        });

        // Auto-clear logic for Predicted side on hit
        if (fin.p.activeNumbers.includes(n)) {
            fin.p.activeNumbers = []; fin.p.activeGroups = []; fin.p.activeRoots = [];
        }

        history.push(n);
        calculateFreq();
        process();
    }

    function calculateFreq() {
        let ops = {"+10":0, "-10":0, "+1":0, "-1":0};
        let sample = history.slice(-15);
        for(let i=0; i < sample.length - 1; i++) {
            let prev = sample[i];
            let curr = sample[i+1];
            for(let op in ops) {
                let t = (op==="+10")?prev+10:(op==="-10")?prev-10:(op==="+1")?prev+1:prev-1;
                if(t >=0 && t <= 36 && getWheelArea(t, 2).includes(curr)) ops[op]++;
            }
        }
        for(let op in ops) document.getElementById('f'+op).innerText = ops[op];
        document.getElementById('fSamp').innerText = Math.max(0, sample.length-1) + "/14";
    }

    function process() {
        // Clear previous highlights
        document.querySelectorAll('.freq-item').forEach(el => el.classList.remove('freq-active'));

        if(history.length < 2) { 
            if(history.length === 1) document.getElementById('lastNum').innerText = history[0];
            updateUI(); return; 
        }
        const last = history[history.length-1];
        const prev = history[history.length-2];
        const nVal = parseInt(document.getElementById('nExp').value);
        const mode = document.getElementById('betType').value;
        const lock = document.getElementById('opLock').value;
        document.getElementById('lastNum').innerText = last;

        let foundOp = null;
        let scanList = (lock === "AUTO") ? ["+10","-10","+1","-1"] : [lock];

        for(let op of scanList) {
            let t = (op==="+10")?prev+10:(op==="-10")?prev-10:(op==="+1")?prev+1:prev-1;
            if(t >=0 && t <= 36 && getWheelArea(t, 2).includes(last)) { 
                foundOp = op; 
                // Highlight the operator box
                document.getElementById('box' + op).classList.add('freq-active');
                break; 
            }
        }

        if(!foundOp) { 
            if (mode !== 'streets') { fin.p.activeNumbers = []; fin.p.activeGroups = []; fin.p.activeRoots = []; }
            syncUnpredicted(mode); renderNotations(mode); updateUI(); return; 
        }

        let target = (foundOp==="+10")?last+10:(foundOp==="-10")?last-10:(foundOp==="+1")?last+1:last-1;
        
        if(target >= 0 && target <= 36) {
            let roots = [target, ...(neighbors[target]||[])];
            let newNumbers = new Set();
            let newGroups = new Set();
            
            roots.forEach(r => {
                let idx = wheel.indexOf(r);
                for(let i=-nVal; i<=nVal; i++) {
                    let num = wheel[(idx+i+37)%37];
                    if (mode === 'straight') newNumbers.add(num);
                    else if (mode === 'streets') newGroups.add(Math.ceil(num/3 || 0.1));
                    else if (mode === 'double') newGroups.add(Math.ceil(num/6 || 0.1));
                }
            });

            if (mode === 'streets') {
                let cur = new Set(fin.p.activeGroups);
                newGroups.forEach(g => cur.add(g));
                fin.p.activeGroups = Array.from(cur).sort((a,b)=>a-b);
            } else if (mode === 'double') {
                fin.p.activeGroups = Array.from(newGroups).sort((a,b)=>a-b);
            } else {
                fin.p.activeNumbers = Array.from(newNumbers);
                fin.p.activeRoots = roots;
            }

            if(mode !== 'straight') {
                let pNums = new Set();
                fin.p.activeGroups.forEach(gid => {
                    let size = (mode === 'streets') ? 3 : 6;
                    for(let i=0; i<size; i++) {
                        let n = (gid === 0) ? 0 : (gid*size)-i;
                        if(n>=0 && n<=36) pNums.add(n);
                    }
                });
                fin.p.activeNumbers = Array.from(pNums);
            }
            syncUnpredicted(mode);
            renderNotations(mode);
        }
        updateUI();
    }

    function syncUnpredicted(mode) {
        fin.u.activeNumbers = wheel.filter(n => !fin.p.activeNumbers.includes(n));
        if(mode === 'streets' || mode === 'double') {
            let max = (mode === 'streets') ? 12 : 6;
            fin.u.activeGroups = [];
            for(let i=1; i<=max; i++) if(!fin.p.activeGroups.includes(i)) fin.u.activeGroups.push(i);
        }
    }

    function getWheelArea(t, n) {
        let s = new Set();
        let pts = [t, ...(neighbors[t]||[])];
        pts.forEach(p => {
            let idx = wheel.indexOf(p);
            for(let i=-n; i<=n; i++) s.add(wheel[(idx+i+37)%37]);
        });
        return Array.from(s);
    }

    function renderNotations(mode) {
        const nVal = document.getElementById('nExp').value;
        ['p', 'u'].forEach(side => {
            let html = "";
            if (mode === 'straight' && side === 'p' && fin.p.activeRoots.length > 0) {
                fin.p.activeRoots.forEach(r => html += `<div class="n-block">${r}n${nVal}</div>`);
            } else {
                let data = (mode === 'straight') ? fin[side].activeNumbers : fin[side].activeGroups;
                data.forEach(item => {
                    let lbl = (mode === 'streets') ? "S"+item : (mode === 'double' ? "DS"+item : item);
                    html += `<div class="${side}-block">${lbl}</div>`;
                });
            }
            document.getElementById(side + 'Not').innerHTML = html;
        });
    }

    function updateUI() {
        const mode = document.getElementById('betType').value;
        ['p', 'u'].forEach(s => {
            document.getElementById(`${s}PL`).innerText = fin[s].pl.toFixed(2);
            document.getElementById(`${s}PL`).className = `val ${fin[s].pl >= 0 ? 'win' : 'loss'}`;
            document.getElementById(`${s}StakeDisp`).innerText = fin[s].stake;
            document.getElementById(`${s}Pct`).innerText = fin.totalBets > 0 ? Math.round((fin[s].wins/fin.totalBets)*100) + "%" : "0%";
        });
        document.getElementById('histStrip').innerHTML = "History: " + history.slice(-12).join(" | ");
    }

    function undo() {
        if(stateHistory.length > 0) {
            let prev = JSON.parse(stateHistory.pop());
            history = prev.history; fin = prev.fin; calculateFreq(); process();
        }
    }

    function clearZones() {
        fin.p.activeNumbers = []; fin.p.activeGroups = []; fin.p.activeRoots = [];
        document.getElementById('pNot').innerHTML = ""; document.getElementById('uNot').innerHTML = ""; updateUI();
    }
</script>
</body>
</html>

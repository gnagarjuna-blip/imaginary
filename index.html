<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BIET - Mathematical Roulette Tracker</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #eee; padding: 15px; }
        .grid-main { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: #161616; padding: 20px; border-radius: 12px; border: 1px solid #333; position: relative; }
        
        .header-panel { grid-column: span 2; display: flex; justify-content: space-between; align-items: center; background: #1a1a1a; padding: 15px; border-radius: 10px; border: 1px solid #444; }
        .op-tag { font-size: 26px; font-weight: bold; color: #f1c40f; text-shadow: 0 0 10px rgba(241, 196, 15, 0.3); }

        .stat-row { display: flex; justify-content: space-between; margin-bottom: 12px; border-bottom: 1px solid #222; padding-bottom: 8px; }
        .val { font-weight: bold; font-family: 'Courier New', monospace; }
        .win { color: #2ecc71; } .loss { color: #e74c3c; }

        .notation-box { background: #050505; padding: 25px; border-radius: 8px; text-align: center; margin: 15px 0; border: 1px inset #333; }
        .math-notation { font-size: 32px; font-weight: bold; color: #3498db; }
        .math-notation span { font-size: 20px; vertical-align: super; color: #9b59b6; margin-left: 2px; }

        .number-panel { grid-column: span 2; display: grid; grid-template-columns: repeat(13, 1fr); gap: 5px; margin: 15px 0; }
        .num-btn { padding: 15px 0; border: none; border-radius: 4px; color: white; font-weight: bold; cursor: pointer; font-size: 16px; }
        .btn-red { background: #c0392b; } .btn-black { background: #2c3e50; } .btn-green { background: #27ae60; grid-row: span 3; }
        
        input[type="number"] { background: #222; color: #fff; border: 1px solid #444; padding: 5px; width: 60px; border-radius: 4px; font-weight: bold; }
        label { font-size: 11px; color: #777; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>

<div class="grid-main">
    <div class="header-panel">
        <div><label>Current Logic</label><div id="activeOp" class="op-tag">DETECTING...</div></div>
        <div style="text-align:right">
            <label>Neighbor Cap (Max 9)</label><br>
            <select id="nVal" style="background:#222; color:white; border:1px solid #444; padding:5px; border-radius:4px;">
                <option value="1">1</option><option value="2">2</option><option value="3" selected>3</option>
                <option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option>
            </select>
        </div>
    </div>

    <div class="card">
        <div class="stat-row"><span>PREDICTED (HOT)</span><span id="pCount">0 Nos</span></div>
        <div class="stat-row"><label>Starting Stake</label><input type="number" id="pStartStake" value="10" onchange="resetProgression('p')"></div>
        <div class="stat-row"><label>P/L</label><span id="pPL" class="val">0.00</span></div>
        <div class="stat-row"><label>Current Stake</label><span id="pStake" class="val">10</span></div>
        <div class="notation-box"><div id="pNotation" class="math-notation">---</div></div>
    </div>

    <div class="card">
        <div class="stat-row"><span>UNPREDICTED (GAPS)</span><span id="uCount">0 Nos</span></div>
        <div class="stat-row"><label>Starting Stake</label><input type="number" id="uStartStake" value="10" onchange="resetProgression('u')"></div>
        <div class="stat-row"><label>P/L</label><span id="uPL" class="val">0.00</span></div>
        <div class="stat-row"><label>Current Stake</label><span id="uStake" class="val">10</span></div>
        <div class="notation-box"><div id="uNotation" class="math-notation" style="color:#2aa198">---</div></div>
    </div>

    <div class="number-panel" id="numberPanel">
        <button class="num-btn btn-green" onclick="handleSpin(0)">0</button>
    </div>
</div>

<script>
    const wheel = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];
    const terminalMap = { 1:[8], 2:[7,9], 3:[8], 4:[11], 5:[10,12], 6:[11], 7:[2,9], 8:[1,3,13,15], 9:[2,14], 10:[5,17], 11:[4,6,16,18], 12:[5,17], 13:[8,20], 14:[7,9,19,21], 15:[8,20], 16:[11,23], 17:[10,12,22,24], 18:[11,23], 19:[14,26], 20:[13,15,25,27], 21:[14,26], 22:[17,29], 23:[16,18,28,30], 24:[17,29], 25:[20,32], 26:[19,21,31,33], 27:[20,32], 28:[23,35], 29:[22,24,34,36], 30:[23,35], 31:[26], 32:[25,27], 33:[26], 34:[29], 35:[28,30], 36:[29] };

    let spins = [];
    let state = {
        p: { pl: 0, stake: 10, active: [] },
        u: { pl: 0, stake: 10, active: [] }
    };

    const panel = document.getElementById('numberPanel');
    for (let i = 1; i <= 36; i++) {
        const btn = document.createElement('button');
        btn.innerText = i;
        btn.className = `num-btn ${[1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36].includes(i) ? 'btn-red' : 'btn-black'}`;
        btn.onclick = () => handleSpin(i);
        panel.appendChild(btn);
    }

    function resetProgression(side) {
        let val = parseFloat(document.getElementById(`${side}StartStake`).value);
        state[side].stake = val;
        updateUI();
    }

    function handleSpin(val) {
        // Resolve results
        ['p', 'u'].forEach(side => {
            if (state[side].active.length > 0) {
                let start = parseFloat(document.getElementById(`${side}StartStake`).value);
                if (state[side].active.includes(val)) {
                    state[side].pl += (state[side].stake * 36) - (state[side].active.length * state[side].stake);
                    state[side].stake = start;
                } else {
                    state[side].pl -= (state[side].active.length * state[side].stake);
                    state[side].stake += start; // Linear progression based on user input
                }
            }
        });

        spins.push(val);
        processLogic();
        updateUI();
    }

    function processLogic() {
        if (spins.length < 2) return;
        const last = spins[spins.length - 1];
        const prev = spins[spins.length - 2];
        const n = parseInt(document.getElementById('nVal').value);

        const ops = [{id:"+10", r:prev+10}, {id:"-10", r:prev-10}, {id:"+1", r:prev+1}, {id:"-1", r:prev-1}];
        let matched = ops.find(o => [o.r, ...(terminalMap[o.r]||[])].includes(last));

        if (!matched) { document.getElementById('activeOp').innerText = "WAITING"; return; }
        document.getElementById('activeOp').innerText = matched.id;

        let target = matched.id === "+10" ? last+10 : matched.id === "-10" ? last-10 : matched.id === "+1" ? last+1 : last-1;
        if (target < 0 || target > 36) return;

        // Prediction side
        let pPoints = [target, ...(terminalMap[target]||[])];
        let pSet = new Set();
        pPoints.forEach(pt => {
            let idx = wheel.indexOf(pt);
            for(let i=-n; i<=n; i++) pSet.add(wheel[(idx+i+37)%37]);
        });
        state.p.active = Array.from(pSet);

        // Unpredicted side
        state.u.active = wheel.filter(num => !pSet.has(num));

        // Display Notation
        document.getElementById('pNotation').innerHTML = pPoints.map(x => `${x}<span>n${n}</span>`).join(" | ");
        document.getElementById('uNotation').innerHTML = formatUnpredicted(state.u.active);
    }

    function formatUnpredicted(nums) {
        let indices = nums.map(n => wheel.indexOf(n)).sort((a,b) => a-b);
        let blocks = [];
        if (indices.length > 0) {
            let temp = [indices[0]];
            for(let i=1; i<indices.length; i++) {
                if(indices[i] === indices[i-1]+1) temp.push(indices[i]);
                else { blocks.push(temp); temp = [indices[i]]; }
            }
            blocks.push(temp);
            if (indices.includes(0) && indices.includes(36)) {
                let l = blocks.pop(); let f = blocks.shift();
                blocks.push([...l, ...f]);
            }
        }
        return blocks.map(b => {
            let center = wheel[b[Math.floor(b.length/2)]];
            let nV = Math.floor((b.length - 1)/2);
            return `${center}<span>n${nV}</span>`;
        }).join(" | ");
    }

    function updateUI() {
        ['p', 'u'].forEach(s => {
            document.getElementById(`${s}PL`).innerText = state[s].pl.toFixed(2);
            document.getElementById(`${s}PL`).className = `val ${state[s].pl >= 0 ? 'win' : 'loss'}`;
            document.getElementById(`${s}Stake`).innerText = state[s].stake;
            document.getElementById(`${s}Count`).innerText = state[s].active.length + " Nos";
        });
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BIET - Fast Wheel Input Tracker</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: #e0e0e0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 95%; max-width: 1100px; background: #1e1e1e; padding: 25px; border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); border: 1px solid #333; }
        
        .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; background: #252525; padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #444; }
        .input-group label { display: block; font-size: 11px; font-weight: bold; color: #3498db; text-transform: uppercase; margin-bottom: 5px; }
        .input-group select, .input-group input { width: 100%; padding: 10px; background: #333; color: #fff; border: 1px solid #555; border-radius: 5px; font-weight: bold; }

        .dashboard { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; margin-bottom: 20px; }
        .info-panel { background: #252525; padding: 15px; border-radius: 10px; border-left: 4px solid #3498db; }
        .bet-panel { background: #1a1a1a; padding: 15px; border-radius: 10px; border: 2px solid #27ae60; text-align: center; }
        
        .op-title { font-size: 14px; color: #999; margin-bottom: 5px; }
        .op-value { font-size: 24px; font-weight: bold; color: #fff; }
        .wheel-shorthand { font-size: 32px; font-weight: bold; color: #2ecc71; letter-spacing: 2px; margin: 10px 0; }
        .note { font-size: 12px; color: #7f8c8d; margin-top: 5px; }

        .number-panel { display: grid; grid-template-columns: repeat(13, 1fr); gap: 6px; margin-bottom: 20px; background: #000; padding: 15px; border-radius: 10px; }
        .num-btn { padding: 15px 0; border: none; border-radius: 4px; color: white; font-weight: bold; cursor: pointer; font-size: 16px; }
        .btn-red { background: #c0392b; } .btn-black { background: #2c3e50; } .btn-green { background: #27ae60; grid-row: span 3; }
        .history { background: #333; padding: 10px; border-radius: 8px; text-align: center; font-family: monospace; font-size: 16px; }
    </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <div class="input-group"><label>Neighbor Count (n)</label>
            <select id="nVal">
                <option value="1">1n</option><option value="2">2n</option><option value="3" selected>3n</option>
                <option value="4">4n</option><option value="5">5n</option>
            </select>
        </div>
        <div class="input-group"><label>Last Operator</label><div id="activeOp" class="op-value" style="font-size: 18px; color: #f1c40f;">WAITING...</div></div>
        <div class="input-group"><label>Reset</label><button onclick="resetSession()" style="width:100%; padding:8px; background:#e74c3c; color:#fff; border:none; border-radius:5px; cursor:pointer; font-weight:bold;">CLEAR DATA</button></div>
    </div>

    <div class="dashboard">
        <div class="info-panel">
            <div class="op-title">PREDICTED TARGETS</div>
            <div id="targetList" style="font-size: 18px; font-weight: bold;">--</div>
            <div class="note">These are Main Terminals based on the last operator move.</div>
        </div>
        <div class="bet-panel">
            <div style="color: #2ecc71; font-weight: bold; text-transform: uppercase; font-size: 12px;">Fast Wheel Input (Unpredicted Zones)</div>
            <div id="shorthandUI" class="wheel-shorthand">READY</div>
            <div id="coverageNote" class="note">Enter numbers to generate instructions.</div>
        </div>
    </div>

    <div class="number-panel" id="numberPanel">
        <button class="num-btn btn-green" onclick="handleSpin(0)">0</button>
    </div>

    <div class="history" id="history">HISTORY: --</div>
</div>

<script>
    const wheelOrder = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];
    const terminalMap = {
        1:[8], 2:[7,9], 3:[8], 4:[11], 5:[10,12], 6:[11], 7:[2,9], 8:[1,3,13,15], 9:[2,14], 10:[5,17],
        11:[4,6,16,18], 12:[5,17], 13:[8,20], 14:[7,9,19,21], 15:[8,20], 16:[11,23], 17:[10,12,22,24],
        18:[11,23], 19:[14,26], 20:[13,15,25,27], 21:[14,26], 22:[17,29], 23:[16,18,28,30], 24:[17,29],
        25:[20,32], 26:[19,21,31,33], 27:[20,32], 28:[23,35], 29:[22,24,34,36], 30:[23,35], 31:[26],
        32:[25,27], 33:[26], 34:[29], 35:[28,30], 36:[29]
    };

    let spins = [];

    // Init Number Panel
    const panel = document.getElementById('numberPanel');
    for (let i = 1; i <= 36; i++) {
        const btn = document.createElement('button');
        btn.innerText = i;
        btn.className = `num-btn ${[1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36].includes(i) ? 'btn-red' : 'btn-black'}`;
        btn.onclick = () => handleSpin(i);
        panel.appendChild(btn);
    }

    function handleSpin(val) {
        spins.push(val);
        document.getElementById('history').innerText = "HISTORY: " + spins.slice(-10).join(" | ");
        processLogic();
    }

    function processLogic() {
        if (spins.length < 2) return;
        const last = spins[spins.length - 1];
        const prev = spins[spins.length - 2];
        const n = document.getElementById('nVal').value;
        
        const ops = [
            { name: "+10", res: prev + 10 }, { name: "-10", res: prev - 10 },
            { name: "+1", res: prev + 1 }, { name: "-1", res: prev - 1 }
        ];

        let matchedOp = null;
        for (let op of ops) {
            let terminals = [op.res, ...(terminalMap[op.res] || [])];
            if (terminals.includes(last)) { matchedOp = op.name; break; }
        }

        if (matchedOp) {
            document.getElementById('activeOp').innerText = matchedOp;
            
            // Calculate NEXT Target based on matched operator
            let nextVal;
            if (matchedOp === "+10") nextVal = last + 10;
            else if (matchedOp === "-10") nextVal = last - 10;
            else if (matchedOp === "+1") nextVal = last + 1;
            else if (matchedOp === "-1") nextVal = last - 1;

            if (nextVal >= 0 && nextVal <= 36) {
                let targets = [nextVal, ...(terminalMap[nextVal] || [])];
                document.getElementById('targetList').innerText = targets.join(", ");
                
                // Build Wheel Shorthand for Fast Input
                // Format: "X p Yn, Z p Yn"
                let shorthand = targets.map(t => `${t} p ${n}n`).join(" | ");
                document.getElementById('shorthandUI').innerText = shorthand;
                document.getElementById('coverageNote').innerText = `Select these ${targets.length} points on the wheel with ${n} neighbors.`;
            }
        } else {
            document.getElementById('activeOp').innerText = "NO MATCH";
            document.getElementById('shorthandUI').innerText = "WAITING";
            document.getElementById('targetList').innerText = "--";
            document.getElementById('coverageNote').innerText = "The move from " + prev + " to " + last + " didn't match an operator.";
        }
    }

    function resetSession() {
        spins = [];
        document.getElementById('activeOp').innerText = "WAITING...";
        document.getElementById('shorthandUI').innerText = "READY";
        document.getElementById('targetList').innerText = "--";
        document.getElementById('history').innerText = "HISTORY: --";
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BIET - High Precision Dual Tracker</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #eee; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 1000px; }
        .grid-main { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        
        .header-panel { grid-column: span 2; display: flex; justify-content: space-between; align-items: center; background: #1a1a1a; padding: 20px; border-radius: 10px; border: 1px solid #444; margin-bottom: 10px; }
        .op-display { display: flex; align-items: center; gap: 10px; }
        .op-tag { font-size: 28px; font-weight: bold; color: #f1c40f; padding: 5px 15px; border-radius: 5px; }
        .best-op { background: rgba(241, 196, 15, 0.2); border: 1px solid #f1c40f; box-shadow: 0 0 10px #f1c40f; }
        
        .lock-btn { cursor: pointer; background: #333; border: 1px solid #555; color: #aaa; padding: 8px 12px; border-radius: 4px; font-weight: bold; }
        .lock-btn.active { background: #d35400; color: white; border-color: #e67e22; }

        .card { background: #161616; padding: 20px; border-radius: 12px; border: 1px solid #333; position: relative; }
        .disabled-card { opacity: 0.3; pointer-events: none; }
        .disabled-tag { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-15deg); background: #e74c3c; color: white; padding: 5px 15px; font-weight: bold; border-radius: 4px; z-index: 10; }

        .stat-row { display: flex; justify-content: space-between; margin-bottom: 12px; border-bottom: 1px solid #222; padding-bottom: 8px; }
        .val { font-weight: bold; font-family: monospace; font-size: 18px; }
        .pct { font-size: 14px; color: #9b59b6; margin-left: 5px; }
        
        .notation-box { background: #050505; padding: 25px; border-radius: 8px; text-align: center; margin: 15px 0; border: 1px inset #333; min-height: 60px; }
        .math-notation { font-size: 32px; font-weight: bold; color: #3498db; display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
        .math-notation span { font-size: 18px; vertical-align: super; color: #9b59b6; }

        .number-panel { grid-column: span 2; display: grid; grid-template-columns: repeat(13, 1fr); gap: 6px; margin: 20px 0; }
        .num-btn { padding: 18px 0; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; font-size: 18px; }
        .btn-red { background: #c0392b; } .btn-black { background: #2c3e50; } .btn-green { background: #27ae60; grid-row: span 3; }
        
        .history-box { grid-column: span 2; background: #111; padding: 10px; border-radius: 8px; border: 1px solid #222; }
        .history-num { display: inline-block; background: #222; padding: 4px 8px; border-radius: 4px; margin: 2px; font-weight: bold; }

        input[type="number"] { background: #222; color: #fff; border: 1px solid #444; padding: 6px; width: 60px; border-radius: 4px; }
        label { font-size: 10px; color: #777; text-transform: uppercase; display: block; }
    </style>
</head>
<body>

<div class="container">
    <div class="grid-main">
        <div class="header-panel">
            <div class="op-display">
                <div><label>Operator</label><div id="activeOp" class="op-tag">--</div></div>
                <button id="lockBtn" class="lock-btn" onclick="toggleLock()">🔓 UNLOCKED</button>
            </div>
            <div style="text-align:center"><label>Hit</label><div id="lastNumBox" style="font-size:32px; font-weight:bold;">--</div></div>
            <div style="text-align:right">
                <label>N-Exponent</label>
                <select id="nVal" onchange="process()" style="background:#222; color:white; border:1px solid #444; padding:8px; border-radius:4px; font-weight:bold;">
                    <option value="1">1</option><option value="2">2</option><option value="3" selected>3</option>
                    <option value="4">4</option>
                </select>
            </div>
        </div>

        <div class="card" id="pCard" style="border-top: 4px solid #3498db;">
            <div class="stat-row"><div><label>Start Stake</label><input type="number" id="pStartStake" value="10" onchange="resetProg('p')"></div><span class="val"><span id="pCount">0</span> <span id="pPct" class="pct">0%</span></span></div>
            <div class="stat-row"><span>P/L</span><span id="pPL" class="val">0.00</span></div>
            <div class="stat-row"><span>Next Bet</span><span id="pStake" class="val">10</span></div>
            <div class="notation-box"><div id="pNotation" class="math-notation">--</div></div>
        </div>

        <div class="card" id="uCard" style="border-top: 4px solid #2aa198;">
            <div id="uDisabledTag" class="disabled-tag" style="display:none">MAX COVERAGE REACHED</div>
            <div class="stat-row"><div><label>Start Stake</label><input type="number" id="uStartStake" value="10" onchange="resetProg('u')"></div><span class="val"><span id="uCount">0</span> <span id="uPct" class="pct">0%</span></span></div>
            <div class="stat-row"><span>P/L</span><span id="uPL" class="val">0.00</span></div>
            <div class="stat-row"><span>Next Bet</span><span id="uStake" class="val">10</span></div>
            <div class="notation-box"><div id="uNotation" class="math-notation" style="color:#2aa198">--</div></div>
        </div>

        <div class="number-panel" id="numberPanel"><button class="num-btn btn-green" onclick="handleSpin(0)">0</button></div>
        <div class="history-box" id="historyList"></div>
        <div style="grid-column: span 2; display:flex; gap:10px; margin-top:10px;">
            <button onclick="undoLast()" style="flex:1; background:#d35400; color:white; padding:15px; border-radius:5px; border:none; cursor:pointer; font-weight:bold;">UNDO</button>
            <button onclick="location.reload()" style="flex:1; background:#333; color:white; padding:15px; border-radius:5px; border:none; cursor:pointer; font-weight:bold;">RESET ALL</button>
        </div>
    </div>
</div>

<script>
    const wheel = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];
    const terminalMap = { 1:[8], 2:[7,9], 3:[8], 4:[11], 5:[10,12], 6:[11], 7:[2,9], 8:[1,3,13,15], 9:[2,14], 10:[5,17], 11:[4,6,16,18], 12:[5,17], 13:[8,20], 14:[7,9,19,21], 15:[8,20], 16:[11,23], 17:[10,12,22,24], 18:[11,23], 19:[14,26], 20:[13,15,25,27], 21:[14,26], 22:[17,29], 23:[16,18,28,30], 24:[17,29], 25:[20,32], 26:[19,21,31,33], 27:[20,32], 28:[23,35], 29:[22,24,34,36], 30:[23,35], 31:[26], 32:[25,27], 33:[26], 34:[29], 35:[28,30], 36:[29] };

    let spins = [];
    let snapshots = [];
    let isLocked = false;
    let lockedOp = null;
    let opStats = {"+10":0, "-10":0, "+1":0, "-1":0};
    let winStats = {p:0, u:0, totalBets:0};
    let state = { p: { pl: 0, stake: 10, active: [] }, u: { pl: 0, stake: 10, active: [] } };

    const panel = document.getElementById('numberPanel');
    for (let i = 1; i <= 36; i++) {
        const btn = document.createElement('button');
        btn.innerText = i;
        btn.className = `num-btn ${[1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36].includes(i) ? 'btn-red' : 'btn-black'}`;
        btn.onclick = () => handleSpin(i);
        panel.appendChild(btn);
    }

    function toggleLock() {
        if (!lockedOp && !isLocked) return; 
        isLocked = !isLocked;
        updateUI();
    }

    function resetProg(side) { state[side].stake = parseFloat(document.getElementById(`${side}StartStake`).value); updateUI(); }

    function handleSpin(val) {
        snapshots.push(JSON.stringify({spins, state, isLocked, lockedOp, opStats, winStats}));
        
        ['p', 'u'].forEach(side => {
            if (state[side].active.length > 0) {
                winStats.totalBets++;
                let base = parseFloat(document.getElementById(`${side}StartStake`).value);
                if (state[side].active.includes(val)) {
                    state[side].pl += (state[side].stake * 36) - (state[side].active.length * state[side].stake);
                    state[side].stake = base;
                    winStats[side]++;
                } else {
                    state[side].pl -= (state[side].active.length * state[side].stake);
                    state[side].stake += base;
                }
            }
        });
        spins.push(val); process(); updateUI();
    }

    function undoLast() { if (snapshots.length > 0) { const snap = JSON.parse(snapshots.pop()); spins = snap.spins; state = snap.state; isLocked = snap.isLocked; lockedOp = snap.lockedOp; opStats = snap.opStats; winStats = snap.winStats; process(); updateUI(); } }

    function getFullRange(target, n) {
        let set = new Set();
        let points = [target, ...(terminalMap[target]||[])];
        points.forEach(p => {
            let idx = wheel.indexOf(p);
            for(let i=-n; i<=n; i++) set.add(wheel[(idx+i+37)%37]);
        });
        return Array.from(set);
    }

    function process() {
        if (spins.length < 2) return;
        const last = spins[spins.length - 1];
        const prev = spins[spins.length - 2];
        const n = parseInt(document.getElementById('nVal').value);
        
        let foundOp = isLocked ? lockedOp : null;

        if (!isLocked) {
            const ops = ["+10", "-10", "+1", "-1"];
            for (let opId of ops) {
                let target = (opId === "+10") ? prev+10 : (opId === "-10") ? prev-10 : (opId === "+1") ? prev+1 : prev-1;
                if (target >= 0 && target <= 36) {
                    if (getFullRange(target, n).includes(last)) { 
                        foundOp = opId; 
                        opStats[opId]++; // Track hits for consistency highlight
                        break; 
                    }
                }
            }
        }

        if (!foundOp) { 
            document.getElementById('activeOp').innerText = "--"; 
            state.p.active = []; state.u.active = []; 
            return; 
        }

        lockedOp = foundOp;
        document.getElementById('activeOp').innerText = foundOp;
        
        // Highlight logic
        const maxHits = Math.max(...Object.values(opStats));
        if (opStats[foundOp] === maxHits && maxHits > 0) document.getElementById('activeOp').classList.add('best-op');
        else document.getElementById('activeOp').classList.remove('best-op');

        let nextTarget = (foundOp === "+10") ? last+10 : (foundOp === "-10") ? last-10 : (foundOp === "+1") ? last+1 : last-1;
        
        if (nextTarget >= 0 && nextTarget <= 36) {
            state.p.active = getFullRange(nextTarget, n);
            
            // Logic for High Coverage Filter
            if (state.p.active.length >= 25) {
                state.u.active = [];
                document.getElementById('uCard').classList.add('disabled-card');
                document.getElementById('uDisabledTag').style.display = 'block';
            } else {
                state.u.active = wheel.filter(num => !state.p.active.includes(num));
                document.getElementById('uCard').classList.remove('disabled-card');
                document.getElementById('uDisabledTag').style.display = 'none';
            }

            let pPoints = [nextTarget, ...(terminalMap[nextTarget]||[])];
            document.getElementById('pNotation').innerHTML = pPoints.map(x => `<div>${x}<span>n${n}</span></div>`).join("");
            document.getElementById('uNotation').innerHTML = state.u.active.length > 0 ? getShorthand(state.u.active) : "--";
        }
    }

    function getShorthand(nums) {
        let indices = nums.map(n => wheel.indexOf(n)).sort((a,b) => a-b);
        let blocks = [];
        if (indices.length > 0) {
            let temp = [indices[0]];
            for(let i=1; i<indices.length; i++) {
                if(indices[i] === indices[i-1]+1) temp.push(indices[i]);
                else { blocks.push(temp); temp = [indices[i]]; }
            }
            blocks.push(temp);
            if (indices.includes(0) && indices.includes(36)) {
                let l = blocks.pop(); let f = blocks.shift(); blocks.push([...l, ...f]);
            }
        }
        return blocks.map(b => {
            let center = wheel[b[Math.floor(b.length/2)]];
            let nv = Math.floor((b.length - 1)/2);
            return `<div>${center}<span>n${nv}</span></div>`;
        }).join("");
    }

    function updateUI() {
        ['p', 'u'].forEach(s => {
            document.getElementById(`${s}PL`).innerText = state[s].pl.toFixed(2);
            document.getElementById(`${s}PL`).className = `val ${state[s].pl >= 0 ? 'win' : 'loss'}`;
            document.getElementById(`${s}Stake`).innerText = state[s].stake;
            document.getElementById(`${s}Count`).innerText = state[s].active.length;
            
            let winRate = winStats.totalBets > 0 ? ((winStats[s] / winStats.totalBets) * 100).toFixed(0) : 0;
            document.getElementById(`${s}Pct`).innerText = winRate + "%";
        });
        document.getElementById('lastNumBox').innerText = spins.length > 0 ? spins[spins.length - 1] : "--";
        document.getElementById('historyList').innerHTML = spins.slice(-15).map(n => `<span class="history-num">${n}</span>`).join("");
        
        const btn = document.getElementById('lockBtn');
        btn.innerText = isLocked ? "🔒 LOCKED" : "🔓 UNLOCKED";
        btn.className = isLocked ? "lock-btn active" : "lock-btn";
    }
</script>
</body>
</html>

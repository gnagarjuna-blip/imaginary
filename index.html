<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BIET - DS Adaptive Broad Match</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 95%; max-width: 1200px; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .bankroll-stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat-card { background: #1a1a1a; color: white; padding: 12px; border-radius: 10px; text-align: center; border-bottom: 4px solid #3498db; }
        .stat-card small { display: block; font-size: 10px; color: #bdc3c7; margin-bottom: 5px; text-transform: uppercase; }
        .stat-card span { font-size: 18px; font-weight: bold; }
        .signal-box { background: #fff3e0; border: 2px solid #ff9800; padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: center; min-height: 110px; }
        .op-badge { background: #2c3e50; color: #fff; padding: 6px 15px; border-radius: 20px; font-size: 14px; font-weight: bold; margin-bottom: 10px; display: inline-block; }
        .streak-badge { background: #2ecc71; color: white; padding: 2px 8px; border-radius: 4px; font-size: 12px; margin-left: 10px; }
        .ds-chip { background: #ff9800; color: white; padding: 10px 20px; border-radius: 5px; font-weight: bold; font-size: 24px; margin: 5px; display: inline-block; box-shadow: 0 4px 0 #bf7100; border: none; }
        .number-panel { display: grid; grid-template-columns: repeat(13, 1fr); gap: 6px; margin-bottom: 20px; background: #1a1a1a; padding: 15px; border-radius: 10px; }
        .num-btn { padding: 12px 0; border: none; border-radius: 4px; color: white; font-weight: bold; cursor: pointer; transition: 0.15s; }
        .num-btn:active { transform: scale(0.9); }
        .btn-red { background: #c0392b; } .btn-black { background: #2c3e50; } .btn-green { background: #27ae60; grid-row: span 3; }
        .history-bar { background: #2c3e50; color: white; padding: 12px; border-radius: 8px; margin-bottom: 15px; width: 100%; text-align: center; font-family: monospace; }
        .waiting-msg { color: #95a5a6; font-style: italic; font-size: 18px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="bankroll-stats">
        <div class="stat-card"><small>Bankroll</small><span id="statBankroll">1500.00</span></div>
        <div class="stat-card"><small>P/L</small><span id="statPL">0.00</span></div>
        <div class="stat-card"><small>Stake</small><span id="statStake">20</span></div>
        <div class="stat-card"><small>Active Op</small><span id="statOp">NONE</span></div>
        <div class="stat-card"><small>Streak</small><span id="statStreak">0</span></div>
    </div>

    <div class="signal-box" id="signalBox">
        <div id="opUI"></div>
        <div id="betList"><span class="waiting-msg">ENTER NUMBERS TO IDENTIFY OPERATOR STREETS</span></div>
    </div>

    <div class="number-panel" id="numberPanel">
        <button class="num-btn btn-green" onclick="handleSpin(0)">0</button>
    </div>

    <div class="history-bar" id="history">Waiting for spins...</div>
    <div style="text-align: right; width: 100%;">
        <button onclick="resetSession()" style="background:#e74c3c; color:white; border:none; padding:10px 25px; border-radius:5px; cursor:pointer; font-weight:bold;">RESET SESSION</button>
    </div>
</div>

<script>
    const redNumbers = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
    const terminalMap = {
        1:[8], 2:[7,9], 3:[8], 4:[11], 5:[10,12], 6:[11], 7:[2,9], 8:[1,3,13,15], 9:[2,14], 10:[5,17],
        11:[4,6,16,18], 12:[5,17], 13:[8,20], 14:[7,9,19,21], 15:[8,20], 16:[11,23], 17:[10,12,22,24],
        18:[11,23], 19:[14,26], 20:[13,15,25,27], 21:[14,26], 22:[17,29], 23:[16,18,28,30], 24:[17,29],
        25:[20,32], 26:[19,21,31,33], 27:[20,32], 28:[23,35], 29:[22,24,34,36], 30:[23,35], 31:[26],
        32:[25,27], 33:[26], 34:[29], 35:[28,30], 36:[29]
    };

    let spins = [];
    let currentBankroll = 1500;
    let baseUnit = 20;
    let sessionPL = 0;
    let currentBetDS = [];
    let activeOpName = null;
    let streakCount = 0;

    const panel = document.getElementById('numberPanel');
    for (let i = 1; i <= 36; i++) {
        const btn = document.createElement('button');
        btn.innerText = i;
        btn.className = `num-btn ${redNumbers.includes(i) ? 'btn-red' : 'btn-black'}`;
        btn.onclick = () => handleSpin(i);
        panel.appendChild(btn);
    }

    function getDS(num) { 
        return (num > 0 && num <= 36) ? Math.ceil(num / 6) : null; 
    }

    // New helper to get all DS associated with a target and its terminals
    function getOperatorDSSet(targetValue) {
        if (targetValue < 1 || targetValue > 36) return [];
        let terminals = terminalMap[targetValue] || [];
        let allNums = [targetValue, ...terminals];
        return [...new Set(allNums.map(n => getDS(n)))].filter(d => d !== null).sort();
    }

    function handleSpin(val) {
        const spinDS = getDS(val);

        // Resolve Bet Result
        if (currentBetDS.length > 0) {
            if (currentBetDS.includes(spinDS)) {
                let profit = (baseUnit * 6) - (currentBetDS.length * baseUnit);
                sessionPL += profit; currentBankroll += profit;
            } else {
                let loss = currentBetDS.length * baseUnit;
                sessionPL -= loss; currentBankroll -= loss;
            }
        }

        spins.push(val);
        processBroadLogic(val);
        updateUI();
    }

    function processBroadLogic(lastResult) {
        if (spins.length < 2) return;
        const prevResult = spins[spins.length - 2];
        const lastDS = getDS(lastResult);
        
        const operators = ["+10", "-10", "+1", "-1"];
        let matchedOp = null;

        // Broad Match: Check if the LATEST spin falls into ANY DS 
        // generated by applying the operator to the PREVIOUS spin.
        for (let op of operators) {
            let target;
            if (op === "+10") target = prevResult + 10;
            else if (op === "-10") target = prevResult - 10;
            else if (op === "+1") target = prevResult + 1;
            else if (op === "-1") target = prevResult - 1;

            let possibleDS = getOperatorDSSet(target);
            if (possibleDS.includes(lastDS)) {
                matchedOp = op;
                break;
            }
        }

        const betListDiv = document.getElementById('betList');
        const opUI = document.getElementById('opUI');

        if (matchedOp) {
            // Update Streak Logic
            if (matchedOp === activeOpName) {
                streakCount++;
            } else {
                activeOpName = matchedOp;
                streakCount = 1;
            }

            // Predict Next: Apply matched operator to LATEST spin
            let nextTarget;
            if (matchedOp === "+10") nextTarget = lastResult + 10;
            else if (matchedOp === "-10") nextTarget = lastResult - 10;
            else if (matchedOp === "+1") nextTarget = lastResult + 1;
            else if (matchedOp === "-1") nextTarget = lastResult - 1;

            let nextDSSet = getOperatorDSSet(nextTarget);

            if (nextDSSet.length > 0 && nextDSSet.length <= 3) {
                currentBetDS = nextDSSet;
                opUI.innerHTML = `<span class="op-badge">${matchedOp} MATCH <span class="streak-badge">Streak: ${streakCount}</span></span>`;
                betListDiv.innerHTML = `<div style="color:#2c3e50; font-size:11px; font-weight:bold; margin-bottom:5px;">PREDICTED FOR NEXT:</div>` + 
                                       currentBetDS.map(d => `<div class="ds-chip">DS ${d}</div>`).join('');
            } else {
                currentBetDS = [];
                opUI.innerHTML = `<span class="op-badge">${matchedOp} (DS > 3)</span>`;
                betListDiv.innerHTML = `<span class="waiting-msg">STREETS DETECTED BUT COUNT IS ${nextDSSet.length} (MAX 3).</span>`;
            }
        } else {
            // Reset if no operator explains the transition
            activeOpName = null;
            streakCount = 0;
            currentBetDS = [];
            opUI.innerHTML = "";
            betListDiv.innerHTML = `<span class="waiting-msg">NO MATCHING STREETS FOUND. WAITING...</span>`;
        }
    }

    function updateUI() {
        document.getElementById('statBankroll').innerText = currentBankroll.toFixed(2);
        document.getElementById('statPL').innerText = sessionPL.toFixed(2);
        document.getElementById('statPL').className = sessionPL >= 0 ? 'val-win' : 'val-loss';
        document.getElementById('statOp').innerText = activeOpName || "NONE";
        document.getElementById('statStreak').innerText = streakCount;
        document.getElementById('history').innerText = "HISTORY: " + spins.slice(-12).join(" | ");
    }

    function resetSession() {
        spins = []; currentBetDS = []; sessionPL = 0; activeOpName = null; streakCount = 0;
        document.getElementById('betList').innerHTML = `<span class="waiting-msg">ENTER NUMBERS TO IDENTIFY OPERATOR STREETS</span>`;
        document.getElementById('opUI').innerHTML = "";
        updateUI();
    }
</script>
</body>
</html>
